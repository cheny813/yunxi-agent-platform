# 真实可加载（enabled: true）的 workflow Agent 定义，专用于验证
# yunxi.aistio.workflow.export-enabled=true 启动期自动导出。
# 与本目录的 workflow-export-example.yml 结构一致，但此处 enabled=true，
# 因此会被 AgentDefinitionLoader 加载进 agentDefinitions，并被
# WorkflowArtifactExporter.exportOnStartup()（@PostConstruct）真正导出。
agent:
  name: "采购审批工作流(端到端验证)"
  description: "开启 export-enabled 后真实导出的 workflow Agent 范本"
  enabled: true
  prompt: "你是采购审批编排协调器，负责按金额路由采购单到人工或自动归档。"
  orchestration:
    pattern: workflow
    # 顶层图：被 order-fulfillment 挂载通过 body.definition: top 引用
    graph:
      nodes:
        - key: intake
          type: agent
          agentId: 11111111-1111-1111-1111-111111111111
        - key: gate
          type: condition
          condition: "amount < 1000"
        - key: approve
          type: approval
          approval:
            approverType: role
            approverRef: 99999999-9999-9999-9999-999999999999
            prompt: 请复核该采购单
        - key: done
          type: join
          join:
            mode: all
        - key: archive
          type: agent
          agentId: 22222222-2222-2222-2222-222222222222
      edges:
        - from: intake
          to: gate
        - from: gate
          to: approve
          condition: "amount >= 1000"
        - from: gate
          to: done
          condition: "amount < 1000"
        - from: approve
          to: done
        - from: done
          to: archive
    mounts:
      # 挂载一：内联图（definitionKey 取 mount.name）
      - name: purchase-review
        body:
          kind: workflow
          graph:
            nodes:
              - key: fetch
                type: agent
                agentId: 11111111-1111-1111-1111-111111111111
              - key: check
                type: condition
                condition: "amount < 1000"
              - key: approve
                type: approval
                approval:
                  approverType: role
                  approverRef: 99999999-9999-9999-9999-999999999999
                  prompt: 请复核该采购单
              - key: done
                type: join
                join:
                  mode: all
              - key: archive
                type: agent
                agentId: 22222222-2222-2222-2222-222222222222
            edges:
              - from: fetch
                to: check
              - from: check
                to: approve
                condition: "amount >= 1000"
              - from: check
                to: done
                condition: "amount < 1000"
              - from: approve
                to: done
              - from: done
                to: archive
      # 挂载二：引用顶层 orchestration.graph（definitionKey 取 body.definition）
      - name: order-fulfillment
        body:
          kind: workflow
          definition: top
