# =============================================================================
# 意图 → Agent / 专家映射表（框架最小演示集）
#
# 【框架定位】本文件是 agent-core 意图引擎的"最小演示集"，仅保留与演示意图树
#   对应的通用映射。它不是业务数据，也不应被业务方直接修改。
#
# 【业务数据在哪】yunxi 默认部署的完整映射表位于 agent-config 配置模块：
#   agent-config/src/main/resources/config/intent/intent-mapping.yml，
#   通过 `yunxi.intent.mapping-table: config/intent/intent-mapping.yml` 覆盖指向。
#   业务方也可通过该配置项指向自己的映射表（支持 file: 外部路径），无需改 Java。
#
# 【匹配语义】agent 精确匹配；experts / tool-groups / skills 为可选集合（含任一
#   即命中）。intent 未命中映射时，框架回落到请求方自带的 agent 目标，不报错。
# =============================================================================
intent-mappings:
  - intent: personal.assistant
    agent: general-assistant
  - intent: faq.general
    agent: general-assistant
