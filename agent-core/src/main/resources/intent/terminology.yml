# =============================================================================
# 术语 / 别名归一化表（框架最小演示集）
#
# 【框架定位】本文件是 agent-core 意图引擎的"最小演示集"，仅保留少量通用口语
#   归一化条目，用于演示改写阶段能力。它不是业务数据，也不应被业务方直接修改。
#
# 【业务数据在哪】yunxi 默认部署的完整术语表位于 agent-config 配置模块：
#   agent-config/src/main/resources/config/intent/terminology.yml，
#   通过 `yunxi.intent.terminology-table: config/intent/terminology.yml` 覆盖指向。
#   业务方也可通过该配置项指向自己的术语表（支持 file: 外部路径），无需改 Java。
#
# 【格式】顶层 `terms` 为 Map<String,String>：key（用户口语）→ value（规范术语）。
# 【匹配规则】按 key 长度降序处理，长词优先，避免子串误替换。
# =============================================================================
terms:
  一周: 一个星期
  卡路里: 热量
  菜谱: 食谱
  餐单: 食谱
