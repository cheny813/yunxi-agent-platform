# AgentConfigurer 冒烟测试用 Agent 定义
# 使用最简单的配置，不依赖 MCP/LLM/Redis/数据库

agent:
  name: smoke-test-agent
  displayName: 冒烟测试Agent
  description: 用于验证AgentConfigurer启动流程的冒烟测试Agent
  enabled: true
  prompt: "你是一个冒烟测试助手，回答总是'冒烟测试通过'。"
  model:
    provider: mock
    modelName: mock-model
  runtime:
    maxIterations: 3
    enableMetaTool: false
  tools:
    mcpServers: []
  toolsGroup:
    systemToolsGroup:
      - memory
