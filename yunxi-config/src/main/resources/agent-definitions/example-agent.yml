# 示例 Agent 定义（生产路径：yunxi-config/src/main/resources/agent-definitions/）
#
# 由 AgentDefinitionLoader 在启动期扫描 classpath*:agent-definitions/**/*.yml 加载，
# 反序列化为 io.yunxi.definition.AgentSpec（定义平面唯一真相源）。顶层即 AgentSpec 字段，
# 不再用 agent: 包裹。字段名严格匹配：拼错（如 permission 写成 permissions）会导致加载失败并提示
# 应改成的字段名，而不是被静默丢弃——静默丢弃会让整段限制失效却毫无报错。
#
# 校验规则（DefaultAgentSpecValidator）：identity.agentId / identity.name 必填。
#
# 桥接：加载后经 AgentProvisioner 在启动期调 AgentConfigurer.configure 构建可运行 HarnessAgent
# 并注册进框架协议层 AguiAgentRegistry / A2aServerRegistry。identity.description 作为系统提示词
# （AgentConfigurer.sysPromptOf 取 identity.description）。模型经 ModelRoutingPolicy 按
# identity.agentId 路由（默认装配已为 example-assistant 注册 qwen3 远程主模型，兜底 qwen-plus）。

identity:
  agentId: example-assistant        # 必填，Agent 唯一标识；同时作为 ModelRoutingPolicy 的路由键
  name: 示例助手                    # 必填，展示名
  description: 你是一个通用智能助手，用简洁、准确的中文回答用户问题。
mcp:
  servers: []
state:
  store: inmemory
  persist: false
permission:
  allowedTools:
    - memory_search
    - memory_get
    - memory_save
  toolGate:
    enabled: false
    tools: []
