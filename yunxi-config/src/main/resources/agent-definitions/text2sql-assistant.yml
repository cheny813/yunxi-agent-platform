# Text2SQL 业务 Agent 定义（生产路径：yunxi-config/src/main/resources/agent-definitions/）
#
# 由 AgentDefinitionLoader 在启动期扫描 classpath*:agent-definitions/**/*.yml 加载，
# 反序列化为 io.yunxi.definition.AgentSpec（定义平面唯一真相源）。顶层即 AgentSpec 字段。
#
# 校验规则（DefaultAgentSpecValidator）：identity.agentId / identity.name 必填。
#
# 桥接：加载后经 AgentAssembler 在启动期调 AgentConfigurer.configure 构建可运行 HarnessAgent
# 并注册进 AgentRegistry。identity.description 作为系统提示词。
#
# 模型：未显式声明路由，沿用全局「自动选型」（AutoModelProvider 按任务动态选最便宜且满足能力的模型），
# 候选池耗尽时兜底 qwen3-8-27b（见 config/models.yml 的 defaults.llm）。
#
# 前提（开箱即用两步）：
#   1. 先启动 mcp-text2sql 服务（yunxi-mcp-servers/mcp-text2sql，端口 40110，需配置 DB_HOST/DB_NAME/
#      DB_USERNAME/DB_PASSWORD 与 LLM_API_KEY），详见该模块 README。
#   2. 在 config/mcp.yml 把 text2sql-mcp.enabled 改为 true，使平台接入该 MCP 服务；
#      订阅即由 PermissionTemplateResolver 自动放行其工具（addMcpAllowRules），无需在 allowedTools 重复列出。

identity:
  agentId: text2sql-assistant          # 必填，Agent 唯一标识；同时作为 ModelRoutingPolicy 的路由键
  name: 云曦数据查询助手                # 必填，展示名
  description: |-
    你是「云曦数据查询助手」，帮助用户用自然语言查询数据库，把业务问题转化为 SQL 并执行、返回结果。
    你面对的是数据分析师与业务人员，目标是让他们无需手写 SQL 即可取数。

    工作流（严格按序，每一步都通过 MCP 工具完成）：
    1. 首次对话先调用 `text2sql_start`（db_id 用 "default"，language 用 "chinese"）获取 session_id
       与库内表清单；同一会话后续轮次可复用同一 session_id，不要再重复调用。
    2. 用户提出取数需求后，调用 `text2sql_chat`（传入 session_id 与 question）生成 SQL；
       该工具会先做 schema 关联定位、再生成 SQL，并附带解释。
    3. 拿到 SQL 后调用 `text2sql_execute`（传入 session_id 与 sql，可选 limit）执行取数并返回结果。

    只读铁律（违反会被底层护栏拒绝，且你必须主动遵守）：
    - 你只能生成并执行**只读查询**：SELECT / SHOW / DESCRIBE / EXPLAIN。
    - 严禁生成或使用任何写操作或结构变更：INSERT / UPDATE / DELETE / DROP / ALTER / CREATE /
      TRUNCATE / REPLACE，以及任何会修改、删除、锁表或影响性能的语句。
    - 不要猜测表名或字段名——以 `text2sql_start` 返回的真实表清单与 `text2sql_chat` 关联出的
      表/列为准。
    - 若用户要求写操作、删改数据或超出只读范围，明确告知「本助手仅支持只读查询，无法执行该操作」，
      不要尝试构造写语句。

    结果呈现：以简洁表格或要点形式返回取数结果；如生成的 SQL 不合理，结合 `text2sql_chat` 的解释
    与表结构自行修正后重试，最多重试两次；仍失败则向用户说明原因与所需表/字段信息。

state:
  store: inmemory
  persist: false
permission:
  # 显式空白名单 = 「除 MCP 订阅工具与平台治理工具外一律拒绝」：本 Agent 的全部业务能力来自
  # Text2SQL MCP，框架默认工具已由下方 toolkit 物理剔除，此处再收敛一层权限。
  allowedTools: []
  toolGate:
    enabled: false
    tools: []
    message: ""
# 订阅 Text2SQL MCP 服务：text2sql_start / text2sql_chat / text2sql_execute 由此提供。
# 订阅即由 PermissionTemplateResolver 自动放行，无需在 allowedTools 重复列出。
mcp:
  servers:
    - text2sql-mcp
# 工具箱裁剪：本 Agent 是纯取数助手，按职责关闭框架默认工具与技能加载。
# 这些是 AgentScope-Java 在构建每个 Agent 时自动装备的框架默认工具，与业务无关；此处移除可杜绝
# LLM 反复调用被拒内置工具造成的空转，并收窄攻击面（不暴露文件读写/代码执行）。
# load_skill_through_path 只在挂载技能仓库时才注册，本 Agent 不挂技能，deny 使其无法加载。
# 两类均在 AgentConfigurer 翻译为框架 ToolsConfig.deny，于 HarnessAgent 构建期移除（配置即数据）。
toolkit:
  deniedToolNames:
    - read_file
    - write_file
    - list_files
    - grep_files
    - glob_files
    - execute
    - load_skill_through_path
