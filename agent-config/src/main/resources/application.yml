# ============================================================
# yunxi Agent Platform 配置总入口（纯入口，不做具体功能配置）
# ============================================================
# 所有具体配置按功能拆分在 config/ 下的独立片段，统一由 config/imports.yml
# 注册与加载。本文件只保留“必须留在根层”的引导项：
#   - spring.config.import：指向 imports.yml（片段清单的唯一真相源）
#   - spring.jackson：全局反序列化兼容开关
# 任何业务配置（服务端口、DB、Redis、aistio、MCP、监控端点等）都去 config/ 对应文件改，
# 不要写回本文件，否则会出现“本文件与片段两处都可写、互相覆盖”的坑。
# 各片段职责见 config/imports.yml 头部注释与每个片段文件头的红线说明。
# ============================================================

spring:
  config:
    import: classpath:config/imports.yml
  # 反序列化时忽略未知属性。AgentScope 的 ChatUsage 序列化会写出 derived 字段 totalTokens，
  # 但反序列化构造器不含该参数，默认会抛 UnrecognizedPropertyException（导致含 usage 的会话/缓存反序列化失败）。
  # 关闭该开关使读写对框架模型字段演进保持兼容。
  jackson:
    deserialization:
      fail-on-unknown-properties: false
  # 关闭框架 AG-UI 内置的 Agent bean 自动扫描（AguiAgentRegistryAutoConfiguration）。
  # yunxi 以 AgentService 为 agent 权威目录，由 agent-ingress 的 YunxiAguiAgentRegistryConfig
  # 单一注册进 AguiAgentRegistry；禁用框架扫描避免与 AgentService 产生第二套注册路径（双份真相）。
  autoconfigure:
    exclude: io.agentscope.spring.boot.agui.common.AguiAgentRegistryAutoConfiguration
