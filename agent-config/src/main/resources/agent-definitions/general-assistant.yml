# ============================================================
# 通用助手 Agent - 纯 YAML 配置，零 Java 代码
# ============================================================
# 此 Agent 演示零代码平台的能力：
# - 无需写任何 Java 类（无 @Component、无 Service、无 Controller）
# - 只需编辑 YAML + 工作区 Markdown 文件
# - 所有能力通过配置注入
# ============================================================
name: general-assistant
displayName: 通用助手
description: "零代码配置的通用智能助手，展示平台配置驱动的全部能力"

# ============================================================
# 模型配置
# ============================================================
model:
  provider: dashscope
  model-name: qwen-plus
  temperature: 0.7
  maxTokens: 4096

# ============================================================
# 工作区路径（自动读取 AGENTS.md / knowledge/ / skills/ 等）
# ============================================================
# 工作区目录: workspace/general-assistant/
# 目录结构由 AgentWorkspaceInitializer 自动创建
# WorkspaceAutoDiscoveryEngine 自动扫描发现：
#   ├ AGENTS.md        → 人格 + 场景检测规则
#   ├ knowledge/       → 领域知识（自动注入）
#   ├ skills/          → 技能（自动注册）
#   └ subagents/       → 子智能体（自动发现）
# ============================================================

# ============================================================
# RAG 知识库配置
# ============================================================
ragMode: GENERIC
knowledgeBases:
  - simple-knowledge  # 使用框架内置的简单知识库

# ============================================================
# MCP 工具注册（这里注册 mcp-nutrition 的工具）
# ============================================================
tools:
  mcpServers:
    - name: nutrition-data-mcp
      type: sse
      url: http://localhost:40602/sse

# ============================================================
# 运行时配置
# ============================================================
runtime:
  maxIterations: 20
  enableMetaTool: false

# ============================================================
# 记忆场景配置
# ============================================================
extensions:
  hitl:
    toolGate:
      enabled: true
      tools:
        - shell_execute
        - file_write