# ============================================================
# 通用助手 Agent - 纯 YAML 配置，零 Java 代码
# ============================================================
# 此 Agent 演示零代码平台的能力：
# - 无需写任何 Java 类（无 @Component、无 Service、无 Controller）
# - 只需编辑 YAML + 工作区 Markdown 文件
# - 所有能力通过配置注入
# ============================================================
agent:
  name: general-assistant
  displayName: 通用助手
  description: "零代码配置的通用智能助手，通过 YAML 和 Markdown 即可定义完整的 Agent 行为"

  # ============================================================
  # 系统提示词
  # ============================================================
  prompt: |
    你是一位能力全面的智能助手，善于借助各类工具高效解决用户的问题。

    ## 可用工具
    - **营养配餐数据查询**（mcp-nutrition）：查询菜品信息、营养数据
    - **知识库检索**（simple-knowledge）：从知识库中查找相关知识

    ## 工作原则
    1. 先理解用户意图，再选择合适的工具
    2. 工具返回结果后，用自然语言清晰呈现给用户
    3. 遇到不确定的信息，主动向用户确认，不做假设

  # ============================================================
  # 模型配置
  # ============================================================
  model:
    provider: dashscope
    modelName: qwen-plus
    temperature: 0.7
    maxTokens: 4096

  # ============================================================
  # RAG 知识库配置
  # ============================================================
  ragMode: GENERIC
  knowledgeBases:
    - simple-knowledge

  # ============================================================
  # 工具组配置
  #
  # 系统内置组（可选值）：
  #   agent      → 子Agent调用工具：call_agent, call_xxx
  #   memory     → 记忆查询工具（默认）：memory_search, memory_get
  #                session_history, session_search, session_list
  #   filesystem → 文件读写工具：read_file, write_file, edit_file
  #                glob_files, list_files, grep_files
  #   execute    → 命令执行工具（高危）：execute
  #   page       → 页面生成工具：pagegen_xxx
  #   general    → 兜底组：未归类的其他本地工具
  #
  # MCP 服务器组名 = tools.mcpServers 中配置的服务器名
  # ============================================================
  toolsGroup:
    systemToolsGroup:
      - memory
      - general
    mcpServersToolsGroup:
    #  - mcp-nutrition

  # ============================================================
  # 运行时配置
  # ============================================================
  runtime:
    maxIterations: 20
    enableMetaTool: false

  # ============================================================
  # 扩展点配置
  # ============================================================
  extensions:
    hitl:
      toolGate:
        enabled: true
        tools:
          # 注意：须填写系统中真实存在的工具名。原名 shell_execute / file_write 在系统中
          # 不存在（配置后无任何报错，但规则永不生效，形同虚设），已修正为真实工具名。
          # 另注意：工具最终是否可用取决于本 Agent 激活的工具组（见上方
          # toolsGroup.systemToolsGroup），未激活组中的工具即使在此列出也不会被触发。
          # 可用工具名参见启动日志中的 "Registered tool 'xxx'" 记录。
          - execute      # 命令执行（高危）
          - write_file   # 文件写入（高危）
          - edit_file    # 文件编辑（高危）
