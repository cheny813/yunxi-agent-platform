# ============================================================
# 通用助手 Agent - 纯 YAML 配置，零 Java 代码
# ============================================================
# 此 Agent 演示零代码平台的能力：
# - 无需写任何 Java 类（无 @Component、无 Service、无 Controller）
# - 只需编辑 YAML + 工作区 Markdown 文件
# - 所有能力通过配置注入
# ============================================================
agent:
  name: general-assistant
  displayName: 通用助手
  description: "零代码配置的通用智能助手，通过 YAML 和 Markdown 即可定义完整的 Agent 行为"

  # ============================================================
  # 系统提示词
  # ============================================================
  prompt: |
    你是一位能力全面的智能助手，善于借助各类工具高效解决用户的问题。

    ## 可用工具
    - **营养配餐数据查询**（mcp-nutrition）：查询菜品信息、营养数据
    - **知识库检索**（simple-knowledge）：从知识库中查找相关知识

    ## 工作原则
    1. 先理解用户意图，再选择合适的工具
    2. 工具返回结果后，用自然语言清晰呈现给用户
    3. 遇到不确定的信息，主动向用户确认，不做假设

  # ============================================================
  # 模型配置
  # ============================================================
  model:
    provider: dashscope
    modelName: qwen-plus
    temperature: 0.7
    maxTokens: 4096

  # ============================================================
  # RAG 知识库配置
  # ============================================================
  ragMode: GENERIC
  knowledgeBases:
    - simple-knowledge

  # ============================================================
  # MCP 工具注册
  # ============================================================
  tools:
    mcpServers:
      - name: nutrition-data-mcp
        type: sse
        url: http://localhost:40602/sse

  # ============================================================
  # 运行时配置
  # ============================================================
  runtime:
    maxIterations: 20
    enableMetaTool: false

  # ============================================================
  # 扩展点配置
  # ============================================================
  extensions:
    hitl:
      toolGate:
        enabled: true
        tools:
          - shell_execute
          - file_write