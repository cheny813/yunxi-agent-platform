# ============================================================
# yunxi Agent Platform 通用数据同步管道配置
# ============================================================
# 此文件定义所有 MySQL → Milvus 的 ETL 管道，供 SyncEngine 读取执行。
#
# ⚠️ 常见陷阱（历史踩坑记录）：
#
#   [精度丢失] source.sql 中的 BigInt 类型 id 会被 Jackson 解析为 Long，
#              SyncEngine.buildMilvusData() 中必须直接用 (Number) val 传递，
#              不可调用 doubleValue()，否则大数值 id 会丢失精度导致重复主键。
#
#   [maxLength] embedding_text 和其他文本字段默认 maxLength=256。
#               使用 GROUP_CONCAT 或长模板时，必须显式指定 maxLength。
#               不足时 Milvus 报: Type mismatch for field 'XXX': VarChar field
#               value type must be JsonPrimitive of string
#
#   [重复主键] 当 SQL 包含 LEFT JOIN 且主表一条记录对应子表多条时，
#              DISTINCT 无法去重（子表列值不同）。必须使用 GROUP_CONCAT
#              聚合为单行，或改用子表 id 作为主键。
#
#   [datasource] datasource 值对应 mcp-database 服务中配置的数据源 id
#                （如 "default"），非真实 MySQL 库名。
#
# 配置格式说明：
#   source.sql         - 数据源 SQL（支持 incremental 增量同步）
#   transform[].type   - 转换类型: concat(拼接) / enrich(值映射) / filter(过滤)
#   target.collection  - Milvus 集合名
#   target.fields      - Milvus Schema 字段定义
# ============================================================

sync-pipelines:

  # ==========================================================
  # 1. 菜品分类同步
  # 原: DishClassesSyncHandler.java (200 行)
  # ==========================================================
  - name: dish-classes-sync
    description: "菜品分类数据同步到 Milvus：支撑菜品分类的向量检索"
    source:
      datasource: default
      # 注意：dish_class 无 description 列，用 COALESCE(remark,'') 替代
      sql: "SELECT id, name, pid AS parent_id, COALESCE(remark, '') AS description FROM dish_class WHERE deleted = 0"
      # 增量同步配置（基于 update_time 游标，重启不丢失）
      # 注意：列名是 update_time 而非 updated_at，历史配置写错导致 SQL 错误
      incremental:
        column: update_time
        initialValue: "2024-01-01 00:00:00"
    transform:
      - type: concat
        field: embedding_text
        template: "菜谱分类 {name}"
    target:
      collection: dish_classes
      collectionDescription: "菜品分类向量库"
      primaryKey: id
      fields:
        - { name: id, type: Int64, primaryKey: true, description: "分类ID" }
        - { name: name, type: VarChar, description: "分类名称" }
        - { name: parent_id, type: Int64, description: "父分类ID" }
        - { name: description, type: VarChar, description: "分类说明" }
        - { name: embedding_text, type: VarChar, description: "向量化文本" }
        - { name: embedding, type: FloatVector, dimension: 1024, description: "分类语义向量" }
      index:
        field: embedding
        metricType: COSINE

  # ==========================================================
  # 2. 食材分类同步
  # 原: IngredientClassesSyncHandler.java (200 行)
  # ==========================================================
  - name: ingredient-classes-sync
    description: "食材分类数据同步：主食/副食/调料等食材分类体系"
    source:
      datasource: default
      # DISTINCT 避免 LEFT JOIN 产生重复 fic.id
      sql: >
        SELECT DISTINCT fic.id, COALESCE(fimc.name, fisc.name) AS name,
               COALESCE(fimc.id, fisc.id) AS parent_id,
               fisc.name AS sub_class_name, fimc.name AS main_class_name
        FROM food_ingredient_class fic
        LEFT JOIN food_ingredient_main_class fimc ON fic.main_id = fimc.id
        LEFT JOIN food_ingredient_sub_class fisc ON fic.sub_id = fisc.id
        WHERE (fimc.deleted = 0 OR fimc.deleted IS NULL)
          AND (fisc.deleted = 0 OR fisc.deleted IS NULL)
    transform:
      - type: concat
        field: embedding_text
        template: "食材分类 {name}"
    target:
      collection: ingredient_classes
      collectionDescription: "食材分类向量库"
      primaryKey: id
      fields:
        - { name: id, type: Int64, primaryKey: true, description: "食材分类ID" }
        - { name: name, type: VarChar, description: "食材分类名称" }
        - { name: parent_id, type: Int64, description: "父分类ID" }
        - { name: main_class_name, type: VarChar, description: "主分类名称" }
        - { name: sub_class_name, type: VarChar, description: "子分类名称" }
        - { name: embedding_text, type: VarChar, description: "向量化文本" }
        - { name: embedding, type: FloatVector, dimension: 1024, description: "分类语义向量" }
      index:
        field: embedding
        metricType: COSINE

  # ==========================================================
  # 3. 营养标准同步
  # 原: NutritionStandardsSyncHandler.java (200 行)
  # ==========================================================
  - name: nutrition-standards-sync
    description: "营养标准数据同步：膳食营养素参考摄入量标准"
    source:
      datasource: default
      sql: "SELECT id, code, name, age_group AS age_range, region AS standard_name FROM nutrient_standard WHERE deleted = 0"
    transform:
      - type: concat
        field: embedding_text
        template: "营养标准 {name} 年龄段 {age_range} 地区 {standard_name}"
    target:
      collection: nutrition_standards
      collectionDescription: "营养标准向量库"
      primaryKey: id
      fields:
        - { name: id, type: Int64, primaryKey: true, description: "标准ID" }
        - { name: code, type: VarChar, description: "标准编码" }
        - { name: name, type: VarChar, description: "标准名称" }
        - { name: age_range, type: VarChar, description: "适用年龄段" }
        - { name: standard_name, type: VarChar, description: "地区标准名" }
        - { name: embedding_text, type: VarChar, description: "向量化文本" }
        - { name: embedding, type: FloatVector, dimension: 1024, description: "标准语义向量" }
      index:
        field: embedding
        metricType: COSINE

  # ==========================================================
  # 4. 营养标准明细同步
  # 原: NutrientStandardDetailsSyncHandler.java (250 行)
  # ==========================================================
  - name: nutrient-standard-details-sync
    description: "营养标准明细数据同步：各标准下每种营养素的推荐摄入量"
    source:
      datasource: default
      sql: >
        SELECT DISTINCT dc.id, ns.id AS ns_id, ns.code AS ns_code, ns.name AS ns_name,
               ns.age_group, ns.region,
               nsc.id AS nsc_id, nsc.name AS nsc_name,
               n.id AS nutrient_id, n.name AS nutrient_name,
               dc.all_recommend_qty,
               dc.intake_suitable_suggestion, dc.intake_low_suggestion, dc.intake_high_suggestion
        FROM nutrient_standard_dcn dc
        LEFT JOIN nutrient_standard ns ON dc.ns_id = ns.id
        LEFT JOIN nutritional_standard_dining_crowd nsc ON dc.nsc_id = nsc.id
        LEFT JOIN nutrient n ON dc.n_id = n.id
        WHERE ns.deleted = 0
    transform:
      - type: concat
        field: embedding_text
        template: "营养标准 {ns_name} {nsc_name} 营养素 {nutrient_name}"
    target:
      collection: nutrient_standard_details
      collectionDescription: "营养标准明细向量库"
      primaryKey: id
      fields:
        - { name: id, type: Int64, primaryKey: true, description: "明细ID" }
        - { name: ns_id, type: Int64, description: "营养标准ID" }
        - { name: ns_code, type: VarChar, description: "标准编码" }
        - { name: ns_name, type: VarChar, description: "标准名称" }
        - { name: age_group, type: VarChar, description: "适用年龄组" }
        - { name: region, type: VarChar, description: "适用地区" }
        - { name: nsc_id, type: Int64, description: "就餐人群ID" }
        - { name: nsc_name, type: VarChar, description: "就餐人群名称" }
        - { name: nutrient_id, type: Int64, description: "营养素ID" }
        - { name: nutrient_name, type: VarChar, description: "营养素名称" }
        - { name: all_recommend_qty, type: Double, description: "推荐摄入量" }
        - { name: embedding_text, type: VarChar, description: "向量化文本" }
        - { name: embedding, type: FloatVector, dimension: 1024, description: "明细语义向量" }
      index:
        field: embedding
        metricType: COSINE

  # ==========================================================
  # 5. 食材营养素同步
  # 原: IngredientNutrientsSyncHandler.java (200 行)
  # ==========================================================
  - name: ingredient-nutrients-sync
    description: "食材营养成分数据同步：每种食材的蛋白质/脂肪/碳水等含量"
    source:
      datasource: default
      sql: >
        SELECT fi.id, fi.name, fi.main_class_id, fi.sub_class_id,
               GROUP_CONCAT(CONCAT(n.name, ':', fin.nutrient_content, n.unit) SEPARATOR ', ') AS nutrients
        FROM food_ingredient fi
        LEFT JOIN food_ingredient_nutrient fin ON fi.id = fin.fi_id
        LEFT JOIN nutrient n ON fin.nutrient_id = n.id
        WHERE fi.deleted = 0
        GROUP BY fi.id, fi.name, fi.main_class_id, fi.sub_class_id
    transform:
      - type: concat
        field: embedding_text
        template: "食材 {name} 营养成分 {nutrients}"
    target:
      collection: ingredient_nutrients
      collectionDescription: "食材营养成分向量库"
      primaryKey: id
      fields:
        - { name: id, type: Int64, primaryKey: true, description: "食材ID" }
        - { name: name, type: VarChar, description: "食材名称" }
        - { name: main_class_id, type: Int64, description: "主分类ID" }
        - { name: sub_class_id, type: Int64, description: "子分类ID" }
        # maxLength=5000: GROUP_CONCAT 结果可能极长，默认 256 不够
        - { name: nutrients, type: VarChar, maxLength: 5000, description: "营养成分(名称:含量+单位)" }
        - { name: embedding_text, type: VarChar, maxLength: 5000, description: "向量化文本" }
        - { name: embedding, type: FloatVector, dimension: 1024, description: "营养成分语义向量" }
      index:
        field: embedding
        metricType: COSINE

  # ==========================================================
  # 7. 评分指标同步
  # 原: ScoreIndexSyncHandler.java (309 行)
  # ==========================================================
  - name: score-index-sync
    description: "评分指标同步：菜品营养评分指标类别和明细"
    source:
      datasource: default
      # 注意：用 detail_id(sid.id) 作主键，一条明细一条记录
      # 每条评分指标明细独立存储，向量搜索时精确命中具体指标
      sql: >
        SELECT sid.id, sic.id AS class_id, sic.index_class, sic.index_ratio AS class_weight,
               sic.dimension, sid.index_name AS detail_name, sid.index_ratio AS detail_weight
        FROM cook_book_score_index_detail sid
        LEFT JOIN cook_book_score_index_class sic ON sid.index_class_id = sic.id
        ORDER BY sid.id
    transform:
      - type: concat
        field: embedding_text
        template: "评分指标 {index_class} - {detail_name} 权重{detail_weight}"
    target:
      collection: cook_book_score_index
      collectionDescription: "评分指标向量库"
      primaryKey: id
      fields:
        - { name: id, type: Int64, primaryKey: true, description: "评分指标明细ID" }
        - { name: class_id, type: Int64, description: "所属指标类别ID" }
        - { name: index_class, type: VarChar, description: "指标类别名称" }
        - { name: class_weight, type: Double, description: "类别权重" }
        - { name: dimension, type: VarChar, description: "维度(周/日/餐)" }
        - { name: detail_name, type: VarChar, description: "指标明细名称" }
        - { name: detail_weight, type: Double, description: "明细权重" }
        - { name: embedding_text, type: VarChar, description: "向量化文本" }
        - { name: embedding, type: FloatVector, dimension: 1024, description: "评分指标语义向量" }
      index:
        field: embedding
        metricType: COSINE
