# ============================================================
# MCP 核心服务配置 (v2.0 迁移说明)
# ============================================================
# v2.0 升级：自建 MCP 协议层已删除，切换为官方 MCP SDK。
# agentscope.core.mcp-servers 配置段由 yunxi 的
# AgentConfigurer.registerMcpServers() 读取（AgentscopeCoreProperties，prefix=agentscope.core），
# 用框架原生 McpClientBuilder 真注册进各 Agent 的 Toolkit（以服务器名建组）；
# 不使用 McpServerRegistrar，也不依赖 mcp-servers.json。
# 以下保留工具缓存配置（仍在使用）。
# ============================================================

# MCP 工具缓存配置 — 只读工具名称列表，这些工具的调用结果可被缓存
mcp:
  cacheable-tools:
    - search_dishes
    - batch_query_dish_ingredients
    - get_dish_details
    - get_nutrient_standard
    - search_ingredients
    - search_knowledge
    - evaluate_recipe

agentscope:
  core:
    mcp-servers:
      # ========================================================================
      # 【核心 MCP 服务器】推荐优先启用
      # ========================================================================

      # --------------------- Database MCP 服务器 ---------------------
      # 端口：40101
      # 协议：SSE
      # 地址：http://localhost:40101/mcp/sse
      # 提供工具：query_db, list_tables, describe_table
      # --------------------------------------------------------------------
      database:
        enabled: ${MCP_DATABASE_ENABLED:true}
        type: sse
        url: ${MCP_DATABASE_URL:http://localhost:40101/mcp/sse}
        timeout: ${MCP_DATABASE_TIMEOUT:60000}
        description: "数据库操作 MCP 服务器【需要单独启动 yunxi-mcp-servers/mcp-database:40101】"

      # --------------------- Redis MCP 服务器 ---------------------
      # 端口：40102
      # 协议：SSE
      # 地址：http://localhost:40102/mcp/sse
      # 提供工具：redis_get, redis_set, redis_delete, redis_keys, redis_list_ops, redis_hash_ops
      # --------------------------------------------------------------------
      redis:
        enabled: ${MCP_REDIS_ENABLED:true}
        type: sse
        url: ${MCP_REDIS_URL:http://localhost:40102/mcp/sse}
        timeout: ${MCP_REDIS_TIMEOUT:60000}
        description: "Redis 数据库操作 MCP 服务器【需要单独启动 yunxi-mcp-servers/mcp-redis:40102】"

      # --------------------- Milvus 向量搜索 MCP 服务器 ---------------------
      # 端口：40103
      # 协议：SSE
      # 地址：http://localhost:40103/mcp/sse
      # 提供工具：search_dishes, get_dish_details（向量搜索学校菜品）
      # --------------------------------------------------------------------
      milvus:
        enabled: ${MCP_MILVUS_ENABLED:true}
        type: sse
        url: ${MCP_MILVUS_URL:http://localhost:40103/mcp/sse}
        timeout: ${MCP_MILVUS_TIMEOUT:60000}
        description: "Milvus 向量搜索 MCP 服务器（提供学校菜品向量搜索功能）"

      # --------------------- Knowledge MCP 服务器 ---------------------
      # 端口：40107
      # 协议：SSE
      # 地址：http://localhost:40107/mcp/sse
      # 提供工具：search_knowledge, add_knowledge
      # --------------------------------------------------------------------
      knowledge:
        enabled: ${MCP_KNOWLEDGE_ENABLED:false}
        type: sse
        url: ${MCP_KNOWLEDGE_URL:http://localhost:40107/mcp/sse}
        timeout: ${MCP_KNOWLEDGE_TIMEOUT:60000}
        description: "知识库 MCP 服务器（提供向量语义搜索功能）【需要单独启动 yunxi-mcp-servers/mcp-knowledge:40107】"

      # --------------------- Nutrition MCP 服务器 ---------------------
      # 端口：40602
      # 协议：SSE（与 mcp-common 的 McpServerFactory 一致，仅暴露 /mcp/sse + /mcp/sse/message）
      # 提供工具：searchDishes, evaluateRecipe
      # 源码：D:\work\code\yunxi-mcp-servers\mcp-nutrition
      # 注意：原 type=http 走 Streamable HTTP 打 /mcp，但服务端未实现该端点（404），
      #       故统一改为 sse，与其它 MCP 服务保持一致。
      # --------------------------------------------------------------------
      mcp-nutrition:
        enabled: ${MCP_NUTRITION_ENABLED:true}
        type: sse
        url: ${MCP_NUTRITION_URL:http://localhost:40602/mcp/sse}
        timeout: ${MCP_NUTRITION_TIMEOUT:60000}
        description: "营养配餐数据查询 MCP 服务器（菜品搜索、营养评估）【需要单独启动 yunxi-mcp-servers/mcp-nutrition】"

      # --------------------- FormFill 智能表单填写 MCP 服务器 ---------------------
      # 端口：40601
      # 协议：SSE + WebSocket (STOMP)
      # SSE地址：http://localhost:40601/mcp/sse
      # WebSocket地址：ws://localhost:40601/ws/formfill
      # 提供工具：formfill_fill（通用填写，按 scene 区分业务场景）、formfill_list_scenes（列出场景）、formfill_get_structure（获取表单结构）
      #   内置示例场景由 scenarios/*.json 驱动，可按需扩展，配置文件从 classpath 下的 scenarios/ 目录加载
      #
      # 说明：mcp-formfill 与 mcp-pagegen、mcp-playwright 的区别
      #   - mcp-formfill: 填写【现有】业务系统表单，通过 WebSocket 实时推送指令到前端页面
      #   - mcp-pagegen: 生成【全新】页面（仪表盘、列表、详情），输出完整 HTML
      #   - mcp-playwright: 通用浏览器自动化（技术工具，非业务专用）
      # 默认禁用：需启动 mcp-formfill 服务（端口40601）后，设 MCP_FORMFILL_ENABLED=true 启用
      # --------------------------------------------------------------------
      formfill:
        enabled: ${MCP_FORMFILL_ENABLED:true}
        type: sse
        url: ${MCP_FORMFILL_URL:http://localhost:40601/mcp/sse}
        timeout: ${MCP_FORMFILL_TIMEOUT:60000}
        description: "智能表单填写 MCP 服务器（支持多种业务场景的表单自动填写，需配合前端 WebSocket 集成）"

      # --------------------- Chart 图表生成 MCP 服务器 ---------------------
      # 端口：40302
      # 协议：SSE
      # 地址：http://localhost:40302/mcp/sse
      # 提供工具：generate_chart
      # 默认禁用：需启动 mcp-chart 服务（端口40302）后，设 MCP_CHART_ENABLED=true 启用
      # --------------------------------------------------------------------
      chart:
        enabled: ${MCP_CHART_ENABLED:false}
        type: sse
        url: ${MCP_CHART_URL:http://localhost:40302/mcp/sse}
        timeout: ${MCP_CHART_TIMEOUT:60000}
        description: "图表生成 MCP 服务器"

      # --------------------- PageGen 页面生成 MCP 服务器 ---------------------
      # 端口：40303
      # 协议：SSE
      # 地址：http://localhost:40303/mcp/sse
      # 提供工具：pagegen_dashboard, pagegen_list, pagegen_detail
      # 说明：生成完整 HTML 页面（仪表盘、列表页、详情页、业务表单等）
      #       与 mcp-formfill 的区别：
      #         - mcp-pagegen: 生成【全新】页面，输出完整 HTML（适用于新建系统）
      #         - mcp-formfill: 填写【现有】系统表单，通过 WebSocket 推送（适用于对接旧系统）
      # 默认禁用：需启动 mcp-pagegen 服务（端口40303）后，设 MCP_PAGEGEN_ENABLED=true 启用
      # --------------------------------------------------------------------
      pagegen:
        enabled: ${MCP_PAGEGEN_ENABLED:false}
        type: sse
        url: ${MCP_PAGEGEN_URL:http://localhost:40303/mcp/sse}
        timeout: ${MCP_PAGEGEN_TIMEOUT:60000}
        description: "页面生成 MCP 服务器"

      # --------------------- Puppeteer 官方 MCP 服务器 ---------------------
      # 官方提供的 Puppeteer MCP 服务器
      # --------------------------------------------------------------------
      puppeteer:
        enabled: ${MCP_PUPPETEER_ENABLED:false}
        type: stdio
        command: npx
        args:
          - "-y"
          - "@modelcontextprotocol/server-puppeteer"
        description: "官方 Puppeteer 浏览器自动化 MCP 服务器"
