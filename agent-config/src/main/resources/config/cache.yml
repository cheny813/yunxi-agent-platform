#############################
# 缓存配置
#############################
spring:
  cache:
    # 缓存类型
    type: redis

    # Redis配置
    redis:
      # 缓存过期时间（秒）
      time-to-live: 1800
      # 缓存空值
      cache-null-values: false
      # 使用key前缀
      use-key-prefix: true
      # key前缀
      key-prefix: "agent:"

    # Caffeine本地缓存配置
    caffeine:
      # 本地缓存最大条数
      spec: maximumSize=1000,expireAfterWrite=300s
