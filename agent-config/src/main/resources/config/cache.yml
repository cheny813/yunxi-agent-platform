#############################
# 缓存配置
#############################
spring:
  cache:
    # 缓存类型
    type: redis

    # Redis配置
    redis:
      # 缓存过期时间（秒）
      time-to-live: 1800
      # 缓存空值
      cache-null-values: false
      # 使用key前缀
      use-key-prefix: true
      # key前缀
      key-prefix: "agent:"

    # Caffeine本地缓存配置
    caffeine:
      # 本地缓存最大条数
      spec: maximumSize=1000,expireAfterWrite=300s

# 自定义缓存配置
# 注意：cache.type / cache.caffeine 是从 server.yml 迁入的本文件（yunxi 自定义缓存抽象），
# 不要与上方 spring.cache.*（Spring 标准缓存）混写。
cache:
  type: caffeine                                         # 本地缓存类型（yunxi 自定义 CacheProperties）
  caffeine:
    spec: maximumSize=1000,expireAfterWrite=600s         # 本地缓存规格
  # API响应缓存
  api:
    # 是否启用API响应缓存
    enabled: true
    # 默认缓存时间（秒）
    default-ttl: 300
    # 是否缓存空响应
    cache-null-responses: false
    # 最大缓存条目数
    max-entries: 10000

  # 会话缓存配置
  conversation:
    # 会话缓存过期时间（秒）
    ttl: 600
    # 最大会话缓存数
    max-size: 1000

  # 字典缓存配置
  dict:
    # 字典缓存过期时间（秒）
    ttl: 3600

  # 用户信息缓存
  user:
    # 用户信息缓存时间（秒）
    ttl: 1800
    # 最大用户缓存数
    max-size: 5000
