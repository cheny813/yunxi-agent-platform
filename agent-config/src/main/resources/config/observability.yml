# ============================================================
# 运维可观测性（management / 指标导出）
# ============================================================
# 红线：management.* 顶层段只在本文件写，禁止在 server.yml 等其它片段重复。
#   原因：exposure.include 等 list 属性是“覆盖”语义而非“合并”，后者加载顺序靠后会盖掉前者，
#   改 server.yml 的暴露清单会无效。本文件统一写全量，并保留 a2a-pipeline 所需端点与 SLO。
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,a2a-pipeline,channels
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  # 非必需依赖的 health indicator 关闭：本平台业务不使用 Elasticsearch（无业务代码引用、
  # pom 无直接依赖），ElasticsearchRestClientHealthIndicator 由 classpath 传递带入的
  # elasticsearch-rest-client 自动注册，默认连 localhost:9200 失败会拖垮主 /actuator/health
  # 聚合（返回 503，影响 k8s 探针）。禁用该 indicator 不影响任何真实业务功能。
  health:
    elasticsearch:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      slo:
        '[a2a.pipeline.execution.time]': 100ms,500ms,1s,5s,10s,30s,60s
    export:
      otlp:
        enabled: true
        endpoint: ${otel.exporter.otlp.endpoint:}
