# 异步处理和线程池配置
# =============================================================================

# Spring异步处理配置
spring:
  task:
    execution:
      # 异步任务执行器
      async:
        thread-name-prefix: "async-task-"
        core-size: 10
        max-size: 50
        queue-capacity: 1000
        keep-alive: 60s
        allow-core-thread-timeout: true
      
      # 调度任务执行器
      scheduling:
        thread-name-prefix: "scheduling-"
        pool:
          size: 3
      
      # 虚拟线程执行器（Java 21+）
      virtual:
        enabled: false
        thread-name-prefix: "virtual-task-"
  
  # 线程池配置
  async:
    # 默认线程池
    executor:
      core-pool-size: 10
      max-pool-size: 50
      queue-capacity: 1000
      thread-name-prefix: "spring-async-"
      keep-alive-seconds: 60
      await-termination-seconds: 30
      wait-for-tasks-to-complete-on-shutdown: true
    
    # AI推理线程池
    inference-executor:
      core-pool-size: 5
      max-pool-size: 20
      queue-capacity: 200
      thread-name-prefix: "inference-"
      keep-alive-seconds: 120
    
    # HTTP客户端线程池
    http-executor:
      core-pool-size: 20
      max-pool-size: 100
      queue-capacity: 500
      thread-name-prefix: "http-client-"
      keep-alive-seconds: 60
