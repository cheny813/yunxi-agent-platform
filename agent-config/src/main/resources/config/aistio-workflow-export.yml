# ============================================================
# aistio 编排图 artifact 导出（启动期）
# ============================================================
# 用途：进程启动时（@PostConstruct）扫描所有 agent 定义中的 workflow 挂载，
#       将内联 / 引用的编排图校验并翻译为 DefinitionSpec artifact
#       （<definitionKey>.definition.json + <definitionKey>.manifest.json），
#       供 aistio 控制台导入，实现「声明 → artifact」的可观测与可分发。
#
# 默认关闭：export-enabled 置 false 时，启动期不扫描、不落盘，零额外开销。
# 上线时只需把 export-enabled 改为 true，并确保目标 workflow Agent 的
# enabled=true（参考同仓 agent-config/src/main/resources/agent-definitions/workflow-export-example.yml）。
#
# 说明：
#   - export-dir 为 artifact 落盘目录，相对路径相对于进程工作目录。
#   - 该开关只控制「声明 → artifact 翻译导出」，不等于「workflow 运行时执行」；
#     运行时编排能力就绪前，导出产物仅用于导入 / 审计 / 版本比对。
#   - push-enabled=true 时，导出完成后自动把每个 definition.json POST 到
#     aistio 控制面（/api/v1/orchestration-definitions），消除控制台手工导入。
#     推送采用控制台账号令牌（PAT），由 push-token 配置；该端点要求登录账号身份，
#     数据面内部令牌不足以创建编排定义，故不复用 yunxi.aistio.internal-token。
# ============================================================
yunxi:
  aistio:
    workflow:
      # 启动期导出总开关，默认关闭，运维按需开启
      export-enabled: true
      # artifact 导出目录（相对进程工作目录）；开启后每个 workflow 挂载产出
      # <definitionKey>.definition.json + <definitionKey>.manifest.json
      export-dir: ./workflow-artifacts
      # 已注册实体 UUID 白名单（agentId / teamRef 等）；
      # 空集合表示不做 E3 拦截，依赖服务端导入期校验兜底
      registered-entity-ids: []
      # —— 自动推送（消除控制台手工导入）——
      # 导出完成后是否自动推送到 aistio 控制面，默认关闭
      push-enabled: true
      # 推送所用的控制台账号令牌（PAT，Authorization: Bearer）。为空不推送。
      # 生产环境建议经由环境变量 / 密钥管理注入，避免明文落盘。
      push-token: ""
      # 推送目标命名空间；留空则默认落到 default 命名空间（控制面 global 命名空间）。
      # 注意控制面的个人命名空间形如 personal-<hash>（非 ns-<userId>），无法从 PAT 推导，
      # 若需推送至个人命名空间，须在此显式配置其真实名称，并确保该 PAT 拥有者对其有写权限，否则返回 403。
      push-namespace: ""
