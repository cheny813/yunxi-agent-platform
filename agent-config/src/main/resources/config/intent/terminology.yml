# =============================================================================
# 术语 / 别名归一化表（yunxi 默认部署业务数据）
#
# 【框架定位】本文件是 yunxi 默认部署的术语表（校园餐 / 居民营养领域），
#   位于 agent-config 配置模块，由 agent-app 打包时带入 classpath。
#
# 【与框架的关系】agent-core 意图引擎通过 `yunxi.intent.terminology-table`
#   配置项指向本文件（config/intent/terminology.yml）。框架 jar 自带的
#   agent-core/src/main/resources/intent/ 下同名文件仅是"最小演示集"。
#
# 【格式】顶层 `terms` 为 Map<String,String>：key（用户口语）→ value（规范术语）。
#
# 【匹配规则】query 包含 key 则替换为 value；按 key 长度降序处理，长词优先，
#   避免子串误替换（如"减肥餐"优先于"餐"）。
#
# 【扩展方式】直接追加 key → value 条目；value 建议使用业务标准术语。
# =============================================================================
terms:
  一周: 一个星期
  7天: 一个星期
  七天: 一个星期
  一个月: 30天
  30天: 一个月
  营养素: 营养
  卡路里: 热量
  减肥餐: 减脂食谱
  增肌餐: 高蛋白食谱
  学生餐: 校园餐
  配餐: 食谱
  菜谱: 食谱
  餐单: 食谱
  荤菜: 畜禽肉类
  主食: 谷薯类
