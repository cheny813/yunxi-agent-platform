# =============================================================================
# 意图 → Agent / 专家映射表（yunxi 默认部署业务数据）
#
# 【框架定位】本文件是 yunxi 默认部署的意图映射表（校园餐 / 居民营养领域），
#   位于 agent-config 配置模块，由 agent-app 打包时带入 classpath。
#
# 【与框架的关系】agent-core 意图引擎通过 `yunxi.intent.mapping-table` 配置项
#   指向本文件（config/intent/intent-mapping.yml）。框架 jar 自带的
#   agent-core/src/main/resources/intent/ 下同名文件仅是"最小演示集"。
#
# 【匹配语义】agent 精确匹配；experts / tool-groups / skills 为可选集合（含任一
#   即命中）。intent 未命中映射时，框架回落到请求方自带的 agent 目标，不报错。
#
# 【扩展方式】追加映射条目即可；intent ID 须与 intent-tree.yml 节点 id 对齐。
# =============================================================================
intent-mappings:
  - intent: recipe.monthly-plan
    agent: nutrition-assistant
    experts: [营养专家]
    tool-groups: [nutrition]
    skills: [recipe-planning]
  - intent: recipe.weekly-plan
    agent: nutrition-assistant
    experts: [营养专家]
    tool-groups: [nutrition]
    skills: [recipe-planning]
  - intent: recipe.single
    agent: nutrition-assistant
    tool-groups: [nutrition]
  - intent: recipe.ingredient-substitute
    agent: nutrition-assistant
    tool-groups: [nutrition]
  - intent: allergen.check
    agent: nutrition-assistant
    experts: [营养专家]
  - intent: nutrition.analysis
    agent: nutrition-assistant
    experts: [营养专家]
  - intent: nutrition.requirement
    agent: nutrition-assistant
    experts: [营养专家]
  - intent: nutrition.advice
    agent: nutrition-assistant
    experts: [营养专家]
  - intent: faq.general
    agent: general-assistant
