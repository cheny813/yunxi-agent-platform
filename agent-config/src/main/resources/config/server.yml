# ============================================================
# HTTP服务性能优化配置
# 仅负责 HTTP 服务（server.*）+ Spring Web/上传。
# 监控/指标段已统一收进 config/observability.yml；
# 响应缓存（cache.type/caffeine）已收进 config/cache.yml。
# 本文件不得再写 management.* 或 cache.* 顶层键。
# ============================================================

server:
  # --------------------- 服务器基本配置 ---------------------
  port: 40001                                             # 服务端口
  address: 0.0.0.0                                       # 绑定IP地址
  servlet:
    session:
      timeout: 30m                                       # 会话超时时间
    context-path: /                                      # 上下文路径
    encoding:
      charset: UTF-8                                     # 字符编码
      enabled: true                                      # 启用编码过滤
      force: true                                        # 强制使用指定编码

  # --------------------- 连接超时配置 ---------------------
  connection-timeout: 20000                              # 连接超时（毫秒）
  tomcat:
    # --------------------- 线程池配置 ---------------------
    threads:
      max: 200                                           # 最大线程数
      min-spare: 20                                      # 最小空闲线程

    # --------------------- 连接器配置 ---------------------
    max-connections: 8192                                # 最大连接数
    max-http-form-post-size: 2MB                         # 最大表单提交大小

    # --------------------- 缓冲区配置 ---------------------
    max-swallow-size: 2MB                                # 最大吞入大小
    max-http-header-size: 8KB                            # HTTP头部最大大小

    # --------------------- 性能优化配置 ---------------------
    background-processor-delay: 30                       # 后台处理延迟（秒）
    basedir: ./tmp                                        # 临时目录
    uri-encoding: UTF-8                                  # URI编码

    # --------------------- 高级优化 ---------------------
    accept-count: 100                                    # 等待队列长度
    connection-timeout: 20000                           # 连接超时
    keep-alive-timeout: 20000                           # 保持连接超时

  # --------------------- HTTP/2配置 ---------------------
  http2:
    enabled: true                                        # 启用HTTP/2

spring:
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 3600                                  # 静态资源缓存时间
      chain:
        cache: true                                      # 启用资源链缓存
        compressed: false                                # 禁用GZIP压缩（由代理处理）
        strategy:
          content:
            enabled: true                                # 启用内容策略
  servlet:
    multipart:
      # 与 file-upload.yml 的 max-file-size 共享同一占位符，改一处即可统一限制
      max-file-size: ${FILE_UPLOAD_MAX_SIZE:10MB}         # 最大文件大小
      max-request-size: ${FILE_UPLOAD_MAX_SIZE:10MB}      # 最大请求大小
      enabled: true                                      # 启用文件上传

# 性能监控配置（Micrometer 原生 metrics.*，非 management.metrics.*）
metrics:
  export:
    prometheus:
      step: 10s                                          # 指标采集间隔
      descriptions: true                                 # 包含描述信息
  distribution:
    percentiles-histogram:
      http:
        server:
          requests: true                                 # HTTP请求直方图


