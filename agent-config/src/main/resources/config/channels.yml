yunxi:
  channels:
    # 总开关：默认关闭，启用后才会把在线 Agent 经框架 Gateway 暴露到 IM 平台
    enabled: false
    # 主 Agent（mainAgent），不配则取 listAgents 第一个；各渠道也可单独指定 default-agent-id
    # default-agent-id: cloud
    definitions:
      dingtalk:
        enabled: false
        channel-id: dingtalk
        type: dingtalk
        default-agent-id: cloud
        props:
          app-key: ${DINGTALK_APP_KEY:}
          app-secret: ${DINGTALK_APP_SECRET:}
          robot-code: ${DINGTALK_ROBOT_CODE:}
          api-base: https://api.dingtalk.com
      feishu:
        enabled: false
        channel-id: feishu
        type: feishu
        default-agent-id: cloud
        props:
          app-id: ${FEISHU_APP_ID:}
          app-secret: ${FEISHU_APP_SECRET:}
          api-base: https://open.feishu.cn
      wecom:
        enabled: false
        channel-id: wecom
        type: wecom
        default-agent-id: cloud
        props:
          corp-id: ${WECOM_CORP_ID:}
          agent-id: ${WECOM_AGENT_ID:}
          secret: ${WECOM_SECRET:}
          api-base: https://qyapi.weixin.qq.com
      github:
        enabled: false
        channel-id: github
        type: github
        default-agent-id: cloud
        props:
          token: ${GITHUB_TOKEN:}
          webhook-secret: ${GITHUB_WEBHOOK_SECRET:}
          api-base: https://api.github.com
      gitlab:
        enabled: false
        channel-id: gitlab
        type: gitlab
        default-agent-id: cloud
        props:
          token: ${GITLAB_TOKEN:}
          api-base: https://gitlab.com
