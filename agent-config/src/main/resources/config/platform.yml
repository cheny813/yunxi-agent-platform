# ============================================================
# yunxi 平台级开关（不归属任何单模块的全局业务配置）
# ============================================================
# 本文件承载原先写在 application.yml 顶层的 yunxi.* 全局业务开关，
# 让 application.yml 保持纯入口。新增平台级开关请放这里，不要写回 application.yml。
yunxi:
  # 平台可观测性总开关（具体指标导出见 config/observability.yml）
  observability:
    enabled: true

  # ============================================================
  # MCP 动态注册协调底座（Nacos 3.2.4）
  # 单机验证：server-addr 指向 docker 启动的 Nacos 8848；集群部署改此处即可。
  # ============================================================
  mcp:
    nacos:
      enabled: true
      server-addr: 127.0.0.1:8848
      namespace: ""
      username: ""
      password: ""
      data-id: yunxi.mcp-servers.json
      group: YUNXI_MCP_GROUP
      service-name: yunxi-mcp-coordinator
