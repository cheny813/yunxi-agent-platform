# ============================================================
# 意图引擎配置（yunxi.intent 前缀；通过 config/imports.yml 随 Spring 配置导入）
#
# 意图引擎是会话入口前的四段前置管道：
#   1) NER 实体识别（ner-dictionaries.yml）——抽取菜品 / 食材 / 营养等实体
#   2) 改写（terminology.yml 术语归一，后续可加指代消解 / LLM 改写）——把口语归一为标准词
#   3) 分类（intent-tree.yml 规则 + 可选 LLM 兜底）——判出意图 ID
#   4) 映射与路由（intent-mapping.yml）——意图 ID 映射到 Agent / 专家 / 工具组
# 关闭方式：enabled: false（行为回退为仅场景检测，等价旧 SceneDetectionService）
#
# 数据分级（详见 docs/guide/16-intent-engine.md）：
#   1) 业务数据（本配置模块）：config/intent/*.yml，yunxi 默认部署的完整业务词典，
#      随 agent-app 打包进入 classpath。
#   2) 框架最小演示集：agent-core/src/main/resources/intent/*.yml，仅作兜底，
#      业务部署一律以本配置为准。
#   3) 完全外部化：将文件拷到部署目录，配置项改为 file:/data/yunxi/intent/xxx.yml。
# 任何业务方均可修改指向自己的数据文件，无需改动 Java 代码。
#
# 意图路由（识别 → 路由闭环）：
#   routing.enabled: true 后，会话入口（chatWithConversation / chatStreamWithConversation）
#   将消费映射表产出的 routeHint 参与路由决策（advisory：目标 agent 不存在 / 分数不足
#   一律保持原路由）。min-route-score 为最低采纳分数，低于该值的建议不改道。
#   默认关闭，验证稳定后逐步开启。
#
# 分类通道：mode=rule（默认，纯规则冻结行为）/ llm（跳过规则直连 LLM）/
#   hybrid（规则优先、LLM 兜底）。mode≠rule 时 HybridIntentClassifier 装配生效，
#   llm.enabled=false 则退化为纯规则通道（不调 LLM、不读缓存）。
#
# 热更新：reload.enabled 控制 reload 能力（actuator 端点 /actuator/intent/*）；
#   poll-seconds > 0 时轮询 file: 前缀资源 mtime（默认 -1 关闭，仅端点触发）。
# ============================================================
yunxi:
  intent:
    enabled: true
    ner-dictionary: classpath:config/intent/ner-dictionaries.yml
    rewrite-enabled: true
    rewrite-processors: [terminology]        # 当前仅 terminology；后续可扩展 coreference、llm
    terminology-table: classpath:config/intent/terminology.yml
    intent-tree: classpath:config/intent/intent-tree.yml
    mapping-table: classpath:config/intent/intent-mapping.yml
    routing:
      enabled: true                          # 意图路由开关（默认关闭，验证稳定后逐步开启）
      min-route-score: 0.5                   # 最低采纳分数（RouteHint.score 低于此值不改道）
    # 分类通道（rule = 纯规则冻结行为；hybrid = 规则优先 + LLM 兜底，语义级路由）
    # 说明：aistio 控制台路由依赖本分类通道做自由措辞识别（如「制定一份晚餐」需语义判为
    # recipe.single 才能改道到 recipe-composer），纯规则模式对不含关键词的口语必然判 unknown
    # 导致改道失效，故启用 hybrid。LLM 超时/熔断/异常一律降级 unknown，由调用方回落默认 agent。
    # web 路径每轮本就调用 analyze()，切 hybrid 仅把规则换成「规则+LLM 兜底」，且 web 路由仍受
    # routing.enabled=false 闸门控制（不会真改道），代价为每轮多一次对话模型（DASHSCOPE_MODEL）分类调用（~2s）。
    classification:
      mode: hybrid                           # rule | llm | hybrid
      rule-confidence-threshold: 0.6         # hybrid 模式规则高分直出阈值
      llm:
        enabled: true                        # LLM 通道总开关（true 才发模型调用）
        # 分类模型与对话模型解耦：占位符 ${INTENT_MODEL:...} 自带兜底值（不设变量也能起），
        # 由 start.ps1 经 -DINTENT_MODEL=$INTENT_MODEL 注入。推荐用快模型（分类是每轮一次的轻量调用）。
        model: ${INTENT_MODEL:qwen-plus}
        # 超时（resilience4j TimeLimiter）；可用 -DINTENT_TIMEOUT_MS 覆盖。
        # 2026-09-21 由 2000 放宽到 10000：2s 对多数模型过紧，超时即降级 unknown，
        # 使意图识别事实性失效（规则未命中的自由措辞永远判 unknown）。放宽后分类可正常完成。
        timeout-ms: ${INTENT_TIMEOUT_MS:10000}
        min-confidence: 0.5                  # LLM 输出最低采纳置信度
        max-intents: 30                      # 白名单上限，超限按查询关键词粗筛 Top-N
        cache:
          ttl-days: 7                        # 缓存 TTL（惰性失效，reload 后按版本跳过）
          max-size: 10000                    # LRU 上限
    # 多域（单域部署保持空，base 由顶层字段构造；
    #  多域示例：在 resolver.domains 下为每个业务域配置独立的 intent-tree 与路由规则）
    resolver:
      default: base                          # 未命中规则的默认域
      rules: []                              # 按 agent 前缀 / 画像的多域路由规则
      domains: {}                            # 业务域数据源（示例：{nutrition: {intent-tree: "..."}}）
    # 热更新
    reload:
      enabled: true                          # reload 开关（actuator 端点受控）
      poll-seconds: -1                       # >0 时轮询 file: 前缀资源 mtime（默认关闭）
