# ============================================================
# 配置加载清单（config/ 下所有片段的唯一真相源）
# ============================================================
# 此文件被 application.yml 通过 spring.config.import 引用。
# 下面列出的 yml 在应用启动时被加载，顺序即覆盖顺序（后者覆盖前者）。
#
# 【想新增一个配置文件】只需在此添加一行（文件放 config/ 目录），并补一条
#   ConfigFragmentValidationTest 的存在性断言，防止改名后静默失效。
#
# 【必选 vs 可选】
#   - 不带 optional: 的为必选模块：文件缺失会启动失败（fail-fast），
#     避免“配置看着写了、实际没加载”的静默黑洞。
#   - 仅 aistio-workflow-export.yml 带 optional:（工作流导出默认关闭，
#     文件不存在也不影响启动）。
#
# 【红线】每个片段只拥有约定好的根前缀、只服务一个模块；
#   跨切面段各归其位：management 在 observability.yml、logging.* 在 logging.yml，
#   禁止在其它片段重复写 management.* / logging.* 顶层键。
# ============================================================
spring:
  config:
    import: >
      classpath:config/server.yml,
      classpath:config/datasource.yml,
      classpath:config/cache.yml,
      classpath:config/async.yml,
      classpath:config/redis.yml,
      classpath:config/llm.yml,
      classpath:config/milvus.yml,
      classpath:config/embedding.yml,
      classpath:config/persistence.yml,
      classpath:config/mcp-core.yml,
      classpath:config/mcp-external.yml,
      classpath:config/resilience.yml,
      classpath:config/rate-limit.yml,
      classpath:config/file-upload.yml,
      classpath:config/a2a-pipeline.yml,
      classpath:config/agentscope.yml,
      classpath:config/muse.yml,
      classpath:config/intent.yml,
      classpath:config/profile.yml,
      classpath:config/platform.yml,
      classpath:config/aistio.yml,
      classpath:config/observability.yml,
      classpath:config/logging.yml,
      optional:classpath:config/aistio-workflow-export.yml
