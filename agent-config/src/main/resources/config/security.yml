# ============================================================
# 边缘安全加固配置（Edge Security Hardening）
# 根前缀：yunxi.security（鉴权模式与内部令牌）；顶层 jwt（JWT 验签）
# 详见 docs/edge-security-hardening-design.md
# ============================================================
yunxi:
  security:
    # 鉴权模式：enforce（默认，受保护端点缺有效凭据即 401）/ dev-trust（回退读头，仅本地无 IdP 开发）
    mode: ${YUNXI_SECURITY_MODE:enforce}
    # 服务间内部令牌头名（与 aistio 控制面共用）
    internal-token-header: ${YUNXI_SECURITY_INTERNAL_TOKEN_HEADER:X-Builder-Internal-Token}

# JWT 验签配置：HS256（jwt.secret）或 RS256（jwt.jwks-uri + jwt.issuer）二选一
# 密钥/ JWKS 地址一律经环境变量或密钥管理注入，禁止写死明文
jwt:
  secret: ${JWT_SECRET:}
  header: ${JWT_HEADER:Authorization}
  prefix: ${JWT_PREFIX:Bearer }
  jwks-uri: ${JWT_JWKS_URI:}
  issuer: ${JWT_ISSUER:}
  # JWKS 缓存 TTL（秒）
  jwks-cache-seconds: ${JWT_JWKS_CACHE_SECONDS:600}
