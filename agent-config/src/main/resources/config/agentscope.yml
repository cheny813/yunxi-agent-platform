# ============================================================
# AgentScope 核心配置
# ============================================================
# 核心配置前缀：agentscope.core
# 扩展配置前缀：agentscope.extensions
# ============================================================

agentscope:
  core:
    # AI API 密钥（必填）
    api-key: ${DASHSCOPE_API_KEY:}

    # 默认模型名称（可选）
    model-name: ${AGENTSCOPE_MODEL:qwen-plus}

    # 模型提供商（可选）
    provider: ${AGENTSCOPE_PROVIDER:dashscope}

    # 默认系统提示词（可选）
    default-prompt: ${AGENTSCOPE_DEFAULT_PROMPT:}

    # 对话超时秒数（默认 8 分钟）
    chat-timeout-seconds: ${AGENTSCOPE_TIMEOUT:480}

    # ============================================================
    # 消息压缩配置（控制 HarnessAgent 历史压缩策略）
    #
    # GA CompactionConfig.Builder 原始默认值（供参考）：
    #   triggerMessages=50, triggerTokens=0(动态=contextWindow-20000),
    #   keepMessages=20, keepTokens=-1(动态=min(8000,max(2000,usable*0.25))),
    #   flushBeforeCompact=true, offloadBeforeCompact=true
    #
    # 本平台对 triggerMessages/triggerTokens/keepMessages 进行了调优覆盖，
    # flushBeforeCompact/offloadBeforeCompact 与 GA 默认保持一致。
    # ============================================================
    compaction:
      # GA 默认 50 → 降为 20，更早触发压缩，控制 token 消耗
      trigger-messages: ${COMPACTION_TRIGGER_MSGS:20}
      # GA 默认 0（动态模式）→ 显式设为 8000，当 token 激增时作为保底触发
      trigger-tokens: ${COMPACTION_TRIGGER_TOKENS:8000}
      # GA 默认 20 → 降为 8，压缩后保留更少消息以减少 token 消耗
      keep-messages: ${COMPACTION_KEEP_MSGS:8}
      # 与 GA 默认 true 一致
      flush-before-compact: ${COMPACTION_FLUSH:true}
      # 与 GA 默认 true 一致
      offload-before-compact: ${COMPACTION_OFFLOAD:true}

    # Studio 可视化调试配置（可选）
    studio:
      enabled: ${AGENTSCOPE_STUDIO_ENABLED:false}
      url: ${AGENTSCOPE_STUDIO_URL:}
      project: ${AGENTSCOPE_STUDIO_PROJECT:}
      run-name-prefix: ${AGENTSCOPE_RUN_PREFIX:run_}

    # Provider 专属配置
    dashscope:
      api-key: ${AGENTSCOPE_DASHSCOPE_API_KEY:}
      model: ${AGENTSCOPE_DASHSCOPE_MODEL:}
      base-url: ${AGENTSCOPE_DASHSCOPE_BASE_URL:}
      timeout: ${AGENTSCOPE_DASHSCOPE_TIMEOUT:60000}

    openai:
      api-key: ${AGENTSCOPE_OPENAI_API_KEY:}
      model: ${AGENTSCOPE_OPENAI_MODEL:}
      base-url: ${AGENTSCOPE_OPENAI_BASE_URL:}
      timeout: ${AGENTSCOPE_OPENAI_TIMEOUT:60000}

    baidu:
      api-key: ${AGENTSCOPE_BAIDU_API_KEY:}
      model: ${AGENTSCOPE_BAIDU_MODEL:}
      base-url: ${AGENTSCOPE_BAIDU_BASE_URL:}
      timeout: ${AGENTSCOPE_BAIDU_TIMEOUT:60000}

    huawei:
      api-key: ${AGENTSCOPE_HUAWEI_API_KEY:}
      model: ${AGENTSCOPE_HUAWEI_MODEL:}
      base-url: ${AGENTSCOPE_HUAWEI_BASE_URL:}
      timeout: ${AGENTSCOPE_HUAWEI_TIMEOUT:60000}

# MCP 服务器配置（由 mcp-core.yml 和 mcp-external.yml 提供）
      # 添加具体的MCP服务器配置，如：
      # local-sqlite:
      #   enabled: false
      #   type: stdio
      #   command: npx
      #   args: ["-y", "@modelcontextprotocol/server-sqlite", "./data/sample.db"]

    # ============================================================
    # GA PlanMode 计划模式配置（agentscope.core.plan，由 AgentConfigurer.configurePlan 读取）
    # 原误置于 agentscope.extensions 下导致无法绑定，现归位到 core 与 mcp-servers 一致。
    # ============================================================
    plan:
      enabled: ${PLAN_ENABLED:false}
      plan-dir: ${PLAN_DIR:plan}
      # 只读工具关键字（逗号分隔）：plan 模式下仅允许这些只读工具 + 框架内置 plan 控制工具
      read-only-tools: ${PLAN_READONLY_TOOLS:read_file,cat,ls,grep,memory_search,git}

    # ============================================================
    # AgentScope-Java 2.0 原生技能系统（agentscope.core.skill，由 AgentConfigurer.configureSkills 读取）
    # 原误置于 agentscope.extensions 下导致无法绑定，现归位到 core。
    # ============================================================
    skill:
      enabled: ${SKILL_ENABLED:false}
      project-global-dir: ${SKILL_PROJECT_DIR:.agentscope/workspace/skills}

    # ============================================================
    # AgentScope-Java 2.0 原生韧性配置（agentscope.core.resilience，由 AgentConfigurer.configureResilience 读取）
    # 原误置于 agentscope.extensions 下导致无法绑定，现归位到 core。
    # ============================================================
    resilience:
      max-retries: ${RESILIENCE_MAX_RETRIES:2}
      fallback-model: ${RESILIENCE_FALLBACK_MODEL:}
      stop-on-reject: ${RESILIENCE_STOP_ON_REJECT:false}
      timeout-ms: ${RESILIENCE_TIMEOUT_MS:120000}

    # ============================================================
    # 执行拦截器配置（agentscope.core.interceptor，由 RagRetrievalInterceptor 读取）
    # 阶段二：请求级文件 RAG 检索拦截器（order=300）开关
    # ============================================================
    interceptor:
      rag-enabled: ${INTERCEPTOR_RAG_ENABLED:true}

    # ============================================================
    # 通用请求审计配置（agentscope.core.audit，由 AuditInterceptor 读取）
    # 阶段二：AuditInterceptor（order=500），默认关闭；开启后 pre 记录开始、
    # post 落库 agent_chat_logs（ConversationMapper.insertChatLog）。
    # ============================================================
    audit:
      enabled: ${AUDIT_ENABLED:false}

  extensions:
    # 自动配置开关
    autoConfigEnabled: ${AGENTSCOPE_AUTO_CONFIG:true}

    # ============================================================
    # 检索默认参数（API 请求中未指定时使用）
    # ============================================================
    retrieve:
      default-limit: ${RAG_DEFAULT_LIMIT:5}
      default-score-threshold: ${RAG_DEFAULT_SCORE_THRESHOLD:0.5}

    # ============================================================
    # V2.0 GA 升级：原 knowledge-bases 配置段（bailian/dify/ragflow/simple）
    # 对应的 KnowledgeAutoConfiguration / *KnowledgeCreator 已删除（rag 包 @Deprecated）。
    # 应用层 RAG 由 ApplicationRAG（基于 FileVectorService + EmbeddingService）在
    # ChatAppService 中注入，不再依赖此 YAML 段。此处删除该段避免 Jackson 绑定到已删类。
    # ============================================================

    # A2A 协议
    a2a:
      enabled: ${A2A_ENABLED:false}
      registry-type: ${A2A_REGISTRY_TYPE:nacos}
      registry-addr: ${A2A_REGISTRY_ADDR:localhost:8848}
      namespace: ${A2A_NAMESPACE:agent-platform}
      # A2A 客户端默认调用超时（秒）
      timeout-seconds: ${A2A_TIMEOUT_SECONDS:60}

# ============================================================
# 框架级超时与缓存配置（可运维调优，均带默认值）
# 以下均为顶层配置键（不隶属于 agentscope 前缀），对应代码中的 @Value 注入
# ============================================================

# 对话接口等待超时（秒）—— ConversationController
conversation:
  timeout-seconds: ${CONVERSATION_TIMEOUT_SECONDS:300}
  # 会话列表缓存 TTL（分钟）—— ConversationDomainService
  session-cache-ttl-minutes: ${CONVERSATION_CACHE_TTL_MINUTES:5}
  # 分布式请求锁 TTL（秒）—— DistributedRequestManager
  request-lock-seconds: ${CONVERSATION_LOCK_SECONDS:300}

# 页面 Agent 执行阻塞超时（秒）—— PageAgentService
page-agent:
  block-timeout-seconds: ${PAGE_AGENT_BLOCK_TIMEOUT:120}

# A2A 服务端调用阻塞超时（分钟）—— A2AServer
a2a:
  server:
    block-timeout-minutes: ${A2A_SERVER_BLOCK_TIMEOUT:5}

# SSE 连接超时（毫秒）—— SseEmitterManager
sse:
  timeout-millis: ${SSE_TIMEOUT_MILLIS:1800000}
