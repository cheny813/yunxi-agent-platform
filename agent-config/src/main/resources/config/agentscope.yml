# ============================================================
# AgentScope 核心配置
# ============================================================
# 核心配置前缀：agentscope.core
# 扩展配置前缀：agentscope.extensions
# ============================================================

agentscope:
  core:
    # AI API 密钥（必填）
    api-key: ${DASHSCOPE_API_KEY:}

    # 默认模型名称（可选）
    model-name: ${AGENTSCOPE_MODEL:qwen-plus}

    # 模型提供商（可选）
    provider: ${AGENTSCOPE_PROVIDER:dashscope}

    # 默认系统提示词（可选）
    default-prompt: ${AGENTSCOPE_DEFAULT_PROMPT:}

    # 对话超时秒数（8分钟，适应复杂食谱配平计算：5天×搜索+食材+评分）
    chat-timeout-seconds: ${AGENTSCOPE_TIMEOUT:480}

    # Studio 可视化调试配置（可选）
    studio:
      enabled: ${AGENTSCOPE_STUDIO_ENABLED:false}
      url: ${AGENTSCOPE_STUDIO_URL:}
      project: ${AGENTSCOPE_STUDIO_PROJECT:}
      run-name-prefix: ${AGENTSCOPE_RUN_PREFIX:run_}

    # Provider 专属配置
    dashscope:
      api-key: ${AGENTSCOPE_DASHSCOPE_API_KEY:}
      model: ${AGENTSCOPE_DASHSCOPE_MODEL:}
      base-url: ${AGENTSCOPE_DASHSCOPE_BASE_URL:}
      timeout: ${AGENTSCOPE_DASHSCOPE_TIMEOUT:60000}

    openai:
      api-key: ${AGENTSCOPE_OPENAI_API_KEY:}
      model: ${AGENTSCOPE_OPENAI_MODEL:}
      base-url: ${AGENTSCOPE_OPENAI_BASE_URL:}
      timeout: ${AGENTSCOPE_OPENAI_TIMEOUT:60000}

    baidu:
      api-key: ${AGENTSCOPE_BAIDU_API_KEY:}
      model: ${AGENTSCOPE_BAIDU_MODEL:}
      base-url: ${AGENTSCOPE_BAIDU_BASE_URL:}
      timeout: ${AGENTSCOPE_BAIDU_TIMEOUT:60000}

    huawei:
      api-key: ${AGENTSCOPE_HUAWEI_API_KEY:}
      model: ${AGENTSCOPE_HUAWEI_MODEL:}
      base-url: ${AGENTSCOPE_HUAWEI_BASE_URL:}
      timeout: ${AGENTSCOPE_HUAWEI_TIMEOUT:60000}

# MCP 服务器配置（由 mcp-core.yml 和 mcp-external.yml 提供）
      # 添加具体的MCP服务器配置，如：
      # local-sqlite:
      #   enabled: false
      #   type: stdio
      #   command: npx
      #   args: ["-y", "@modelcontextprotocol/server-sqlite", "./data/sample.db"]

    # ============================================================
    # GA PlanMode 计划模式配置（agentscope.core.plan，由 AgentConfigurer.configurePlan 读取）
    # 原误置于 agentscope.extensions 下导致无法绑定，现归位到 core 与 mcp-servers 一致。
    # ============================================================
    plan:
      enabled: ${PLAN_ENABLED:false}
      plan-dir: ${PLAN_DIR:plan}
      # 只读工具关键字（逗号分隔）：plan 模式下仅允许这些只读工具 + GA 内置 plan 控制工具
      read-only-tools: ${PLAN_READONLY_TOOLS:read_file,cat,ls,grep,memory_search,git}

    # ============================================================
    # GA 原生技能系统（agentscope.core.skill，由 AgentConfigurer.configureSkills 读取）
    # 原误置于 agentscope.extensions 下导致无法绑定，现归位到 core。
    # ============================================================
    skill:
      enabled: ${SKILL_ENABLED:false}
      filesystem-dir: ${SKILL_FS_DIR:.agentscope/workspace/skills}
      writeable: ${SKILL_WRITABLE:false}
      project-global-dir: ${SKILL_PROJECT_DIR:}

    # ============================================================
    # GA 原生韧性配置（agentscope.core.resilience，由 AgentConfigurer.configureResilience 读取）
    # 原误置于 agentscope.extensions 下导致无法绑定，现归位到 core。
    # ============================================================
    resilience:
      max-retries: ${RESILIENCE_MAX_RETRIES:2}
      fallback-model: ${RESILIENCE_FALLBACK_MODEL:}
      stop-on-reject: ${RESILIENCE_STOP_ON_REJECT:false}
      timeout-ms: ${RESILIENCE_TIMEOUT_MS:120000}

  extensions:
    # 自动配置开关
    autoConfigEnabled: ${AGENTSCOPE_AUTO_CONFIG:true}

    # ============================================================
    # 检索默认参数（API 请求中未指定时使用）
    # ============================================================
    retrieve:
      default-limit: ${RAG_DEFAULT_LIMIT:5}
      default-score-threshold: ${RAG_DEFAULT_SCORE_THRESHOLD:0.5}

    # ============================================================
    # V2.0 GA 升级：原 knowledge-bases 配置段（bailian/dify/ragflow/simple）
    # 对应的 KnowledgeAutoConfiguration / *KnowledgeCreator 已删除（rag 包 @Deprecated）。
    # 应用层 RAG 由 ApplicationRAG（基于 FileVectorService + EmbeddingService）在
    # ChatAppService 中注入，不再依赖此 YAML 段。此处删除该段避免 Jackson 绑定到已删类。
    # ============================================================

    # A2A 协议
    a2a:
      enabled: ${A2A_ENABLED:false}
      registry-type: ${A2A_REGISTRY_TYPE:nacos}
      registry-addr: ${A2A_REGISTRY_ADDR:localhost:8848}
      namespace: ${A2A_NAMESPACE:agent-platform}
