worker_processes 1;

events {
    worker_connections 1024;
}

# 多实例负载均衡：把 /agentscope 流量轮询到两个应用实例。
# 会话级状态由 Redis（轨迹）+ 框架工作空间隔离承载，故无状态轮询对断点续传安全。
http {
    upstream yunxi_apps {
        server app1:40001 max_fails=3 fail_timeout=10s;
        server app2:40001 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 40010;

        location /agentscope/ {
            proxy_pass http://yunxi_apps/agentscope/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # SSE / 长连接：关闭缓冲，透传分块
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }

        location /api/traces/ {
            proxy_pass http://yunxi_apps/api/traces/;
            proxy_set_header Host $host;
        }

        location /health {
            proxy_pass http://yunxi_apps/actuator/health;
        }
    }
}
