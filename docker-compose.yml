# ============================================================
# yunxi-agent-platform 基础设施一键启动（单机验证版）
# ============================================================
# 启动全部（9 个服务，开箱即用）：
#   docker compose up -d
# 停止： docker compose down
# 重置： docker compose down -v && docker compose up -d
#
# 单机版说明：本文件面向「功能验证 / 试用推广 / 低配机器」场景，
#   Nacos 采用 standalone 单机（内置 Derby，免外部 MySQL），对机器要求低、开箱即用。
#   生产高可用（3 节点集群 + Raft）请使用 docker-compose.nacos-cluster.yml。
#
# 服务清单（共 9 个容器，全部默认启动）：
#   核心：MySQL / Redis / etcd / MinIO / Milvus / Nacos
#   默认启用：Attu UI / OTel Collector / Jaeger
#   Ollama 为本地进程（端口 11434），不在此编排，需单独安装 ollama pull。
#   管控面 aistio（AgentScope-Service）：默认不启动，纳入可选 profile「aistio」。
#     需要 Agent 管控 / 治理可视化 / 会话干预能力时执行：
#       docker compose --profile aistio up -d
#     aistio 由 agentscope-service 仓库源码本地构建（无公开镜像），前置条件与接入方式见文末 aistio 段注释。
# ┌──────────────────┬───────────┬───────────────────────────────────┐
# │ 服务              │ 端口       │ 说明                              │
# ├──────────────────┼───────────┼───────────────────────────────────┤
# │ MySQL 8.0        │ 3306      │ 主数据库（会话/技能/配置持久化）    │
# │ Redis 7          │ 6379      │ 缓存/分布式状态/会话（其余特性）   │
# │ Milvus Standalone │ 19530     │ 向量数据库（记忆/语义检索）      │
# │ MinIO (Milvus)   │ 9000      │ Milvus 对象存储（内部）            │
# │ etcd (Milvus)    │ 2379      │ Milvus 元数据协调（内部，不暴露）  │
# │ Nacos 单机        │ 8848/8080 │ MCP 注册中心+配置热更新+AI Registry │
# ├──────────────────┼───────────┼───────────────────────────────────┤
# │ Attu UI          │ 8000      │ Milvus 向量库 Web 管理界面（可选）  │
# │ OTel Collector   │ 4317/4318 │ 链路追踪收集器（可选，转发至 Jaeger）│
# │ Jaeger UI        │ 16686     │ 链路追踪可视化（可选）             │
# └──────────────────┴───────────┴───────────────────────────────────┘
#
# Milvus 首次启动需要 30-60 秒，请耐心等待。
# 可选服务不启动也不影响核心功能，仅链路追踪 / 向量库 UI 丢失。
#
# 注意：LLM API Key 请在 start.ps1 或环境变量中配置。

services:
  # ============================================================
  # MySQL 8.0 — 主数据库
  # ============================================================
  mysql:
    image: mysql:8.0
    container_name: yunxi-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: yunxi_agent_platform
      TZ: Asia/Shanghai
    command:
      [
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_unicode_ci",
      ]
    healthcheck:
      test:
        ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - yunxi-mysql-data:/var/lib/mysql
      # 一键初始化 mcp-nutrition 所需的 yunxi_nutrition 库与空表结构，
      # 使 mcp-nutrition 在本地/外部环境下也能跑起来（不含任何业务数据）。
      - ./scripts/init/nutrition-schema.sql:/docker-entrypoint-initdb.d/02-nutrition-schema.sql:ro
    networks:
      - yunxi-net

  # ============================================================
  # Redis 7 — 缓存 & 分布式状态
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: yunxi-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "redispass",
      ]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redispass", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - yunxi-redis-data:/data
    networks:
      - yunxi-net

  # ============================================================
  # etcd — Milvus 元数据协调（内部组件，不暴露端口）
  # ============================================================
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: yunxi-milvus-etcd
    restart: unless-stopped
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    # advertise-client-urls 必须用容器可达的服务名/地址（etcd:2379），
    # 不能用 127.0.0.1（仅本容器回环），否则其他容器按广播地址无法连接。
    command: >
      etcd
      -advertise-client-urls=http://etcd:2379
      -listen-client-urls http://0.0.0.0:2379
      --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    volumes:
      - yunxi-etcd-data:/etcd
    networks:
      - yunxi-net

  # ============================================================
  # MinIO — Milvus 对象存储（内部组件）
  # ============================================================
  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: yunxi-milvus-minio
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    command: minio server /minio_data --console-address :9001
    healthcheck:
      test:
        ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    volumes:
      - yunxi-minio-data:/minio_data
    networks:
      - yunxi-net

  # ============================================================
  # Milvus Standalone — 向量数据库
  # ============================================================
  milvus:
    image: milvusdb/milvus:v2.3.3
    container_name: yunxi-milvus
    restart: unless-stopped
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
    # 关键：milvusdb/milvus 独立镜像无默认 Cmd（镜像 Config.Cmd=null，entrypoint 仅 ["/tini","--"]）。
    # 必须显式指定启动命令，否则 /tini 无程序可执行，容器会在 0.x 秒内 Exited(1) 秒退。
    command: ["milvus", "run", "standalone"]
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - yunxi-milvus-data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 60s
    networks:
      - yunxi-net

  # ============================================================
  # Nacos 3.2.4 — 单机版（standalone，内置 Derby，免外部 MySQL）
  # 平台统一协调底座：MCP 注册中心 + 配置热更新 + AI Registry（MCP/Skill/Agent/Prompt）
  # 应用连接地址（docker 网络内）：nacos:8848
  #   nacos-client 自动以 port+1000 推导 gRPC 端口(9848)
  # 端口说明（Nacos 3.x）：
  #   8848 = 主 API（HTTP）
  #   8080 = 控制台（Nacos 3.x 从 8848 解耦出来的新控制台端口）
  #   9848 = gRPC 客户端端口（=8848+1000，应用 SDK 实际连这个）
  # 单机版为「试用/验证/低配机器」场景，鉴权默认关闭以零配置启动；
  #   生产高可用请用 docker-compose.nacos-cluster.yml（3 节点集群，鉴权开启）。
  # 参考：https://nacos.io/blog/nacos-gvr7dx_awbbpb_eerxlks19kgclceq/  （Nacos 3.2 AI Registry）
  #      https://nacos.io/docs/latest/overview/                          （Nacos 3.x 概览）
  # ============================================================
  nacos:
    image: nacos/nacos-server:v3.2.4
    container_name: yunxi-nacos
    hostname: yunxi-nacos
    restart: unless-stopped
    environment:
      - MODE=standalone
      - NACOS_AUTH_ENABLE=false
      - NACOS_AUTH_IDENTITY_KEY=yunxi-nacos-key
      - NACOS_AUTH_IDENTITY_VALUE=yunxi-nacos-2026
      - NACOS_AUTH_TOKEN=VGhpc0lzQW5OdWNhQ29zQXV0aFRva2VuRm9yWW91blhpMjAyNlN0YW5kYWxvbmU=
    volumes:
      - yunxi-nacos-data:/home/nacos/data
      - yunxi-nacos-logs:/home/nacos/logs
    ports:
      - "8848:8848"   # 主 API（HTTP）
      - "8080:8080"   # 控制台（Nacos 3.x 新解耦端口）
      - "9848:9848"   # gRPC 客户端端口（应用 SDK 连接）
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - yunxi-net

  # ============================================================
  # 以下为默认启用的服务（原可选服务，现已默认启动）
  # ============================================================

  # ============================================================
  # Attu — Milvus 向量库 Web 管理界面
  #   访问 http://127.0.0.1:8000 ，连接 milvus:19530
  # 启动： docker compose up -d attu
  # ============================================================
  attu:
    image: zilliz/attu:v2.4
    container_name: yunxi-attu
    restart: unless-stopped
    environment:
      - MILVUS_URL=milvus:19530
    ports:
      - "8000:3000" # Attu Web UI（容器内 3000）
    depends_on:
      - milvus
    networks:
      - yunxi-net

  # ============================================================
  # OpenTelemetry Collector — 链路追踪
  # 启动： docker compose up -d otel-collector
  # 配置挂载 scripts/deploy/otel-collector-config.yaml（已含 traces + metrics 管线）
  # ============================================================
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.97.0
    container_name: yunxi-otel-collector
    restart: unless-stopped
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./scripts/deploy/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    networks:
      - yunxi-net

  # ============================================================
  # Jaeger — 链路追踪可视化
  #   访问 http://127.0.0.1:16686 查看调用链
  #   trace 由 otel-collector 通过 otlp/jaeger exporter 转发至此
  #   （默认配置仅 logging 导出，需可视化时请在 otel-collector-config.yaml 放开 jaeger exporter）
  # 启动： docker compose up -d jaeger
  # ============================================================
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: yunxi-jaeger
    restart: unless-stopped
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # Jaeger UI
    depends_on:
      - otel-collector
    networks:
      - yunxi-net

  # ============================================================
  # AgentScope-Service（aistio）管控面 — 可选 Profile: aistio
  # ------------------------------------------------------------
  # 用途：补齐「Agent 管控 / 治理可视化 / 会话干预」能力（设计见 docs/agentscope-service-integration-design.md）。
  # 默认不启动（保持单机版低配开箱即用）；需要时执行：
  #   docker compose --profile aistio up -d
  #
  # 前置条件（本编排只负责拉起，不负责编译；须先在 agentscope-service 仓库完成构建）：
  #   1) cd <AISTIO_SRC> && mvn -pl agentscope-service -am install -DskipTests
  #   2) (cd <AISTIO_SRC>/frontend && npm run build)   # 生成 aistio/ui，打包进 gateway 镜像
  # 源码位置由环境变量指定：AISTIO_ROOT 指向 AgentScope-Java 仓库根（默认 ../agentscope-java-2.0GA），
  # AISTIO_SRC 指向其下 agentscope-service 子目录（默认 ../agentscope-java-2.0GA/agentscope-service）。
  # aistio-control 须以仓库根为构建上下文（Dockerfile.control 内 COPY agentscope-service/*），
  # 故用 AISTIO_ROOT；其余平面以 agentscope-service 为上下文，用 AISTIO_SRC。
  # 注意：不要通过 AISTIO_SRC/.. 之类推算仓库根，Windows 下混合分隔符会使构建上下文解析为空目录。
  # 产物版本号由 AISTIO_VERSION 指定（默认 2.0.3，须与本仓库根 pom 的 <revision> 一致；
  #   若你的 agentscope-service 仓库 revision 不同，先 export AISTIO_VERSION=<其版本> 再启动）。
  #
  # yunxi 接入（application.yml / 环境变量）：
  #   yunxi.aistio.enabled=true
  #   yunxi.aistio.control-plane-url=http://localhost:18080   # 即下方 gateway 发布端口
  #   yunxi.aistio.internal-token=compose-local-internal-token-at-least-32chars
  #   yunxi.aistio.base-url=http://<本机IP或localhost>:40001/agentscope
  #
  # 端口说明：gateway 发布到主机 18080（避开本编排中 Nacos 控制台已占用的 8080），供 yunxi 经控制面 API 接入；
  #   control 8081（Go aistiod，同时承载 Web 控制台，已发布到主机 8081）/ data 8082 / scheduler 8083 为内部平面；
  #   db 5432 可移除避免与本地 Postgres 冲突。
  # 注意：aistiod 为 Go 二进制、gateway/data/scheduler 为 Java 平面，均从 AISTIO_SRC 源码构建，
  #   agentscope-service 无公开镜像，故必须先行本地构建后再 --profile aistio 启动。
  # ============================================================
  aistio-db:
    image: postgres:17
    container_name: yunxi-aistio-db
    restart: unless-stopped
    profiles: ["aistio"]
    environment:
      POSTGRES_DB: builder
      POSTGRES_USER: builder
      POSTGRES_PASSWORD: builder
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U builder -d builder"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - aistio-db-data:/var/lib/postgresql/data
      - ${AISTIO_SRC:-../agentscope-java-2.0GA/agentscope-service}/docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-schemas.sql:ro
    ports:
      - "5432:5432"   # 可选；与本地 Postgres 冲突时删除此行
    networks:
      - yunxi-net

  aistio-control:
    build:
      context: ${AISTIO_ROOT:-../agentscope-java-2.0GA}
      dockerfile: agentscope-service/docker/Dockerfile.control
    container_name: yunxi-aistio-control
    restart: unless-stopped
    profiles: ["aistio"]
    command:
      - --storage-driver=postgres
      - --storage-dsn=postgres://builder:builder@aistio-db:5432/builder?sslmode=disable&search_path=rt
      - --log-format=console
    environment:
      AISTIO_ENABLE_KUBERNETES: "false"
      AISTIO_PRODUCT_DSN: postgres://builder:builder@aistio-db:5432/builder?sslmode=disable
      AISTIO_HTTP_BIND: ":8081"
      BUILDER_JWT_SECRET: builder-compose-dev-secret-change-in-production-32chars
      BUILDER_INTERNAL_TOKEN: compose-local-internal-token-at-least-32chars
      BUILDER_DATA_URL: http://aistio-data:8082
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "/aistiod", "--healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    depends_on:
      aistio-db:
        condition: service_healthy
    networks:
      - yunxi-net

  aistio-data:
    build:
      context: ${AISTIO_SRC:-../agentscope-java-2.0GA/agentscope-service}
      dockerfile: docker/Dockerfile.plane
      args:
        JAR_FILE: service-dataplane/target/service-dataplane-${AISTIO_VERSION:-2.0.3}.jar
    container_name: yunxi-aistio-data
    restart: unless-stopped
    profiles: ["aistio"]
    environment:
      SPRING_PROFILES_ACTIVE: jdbc
      BUILDER_DB_URL: jdbc:postgresql://aistio-db:5432/builder?currentSchema=dp
      BUILDER_DB_DRIVER: org.postgresql.Driver
      BUILDER_DB_USER: builder
      BUILDER_DB_PASSWORD: builder
      BUILDER_JWT_SECRET: builder-compose-dev-secret-change-in-production-32chars
      BUILDER_INTERNAL_TOKEN: compose-local-internal-token-at-least-32chars
      BUILDER_CONTROL_URL: http://aistio-control:8081
      BUILDER_DATA_URL: http://aistio-data:8082
      SERVER_PORT: 8082
      BUILDER_DATAPLANE_PUBLIC_URL: http://aistio-data:8082
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    depends_on:
      aistio-db:
        condition: service_healthy
      aistio-control:
        condition: service_healthy
    networks:
      - yunxi-net

  aistio-scheduler:
    build:
      context: ${AISTIO_SRC:-../agentscope-java-2.0GA/agentscope-service}
      dockerfile: docker/Dockerfile.plane
      args:
        JAR_FILE: service-scheduler/target/service-scheduler-${AISTIO_VERSION:-2.0.3}.jar
    container_name: yunxi-aistio-scheduler
    restart: unless-stopped
    profiles: ["aistio"]
    environment:
      SPRING_PROFILES_ACTIVE: jdbc
      BUILDER_DB_URL: jdbc:postgresql://aistio-db:5432/builder?currentSchema=dp
      BUILDER_DB_DRIVER: org.postgresql.Driver
      BUILDER_DB_USER: builder
      BUILDER_DB_PASSWORD: builder
      BUILDER_JWT_SECRET: builder-compose-dev-secret-change-in-production-32chars
      BUILDER_INTERNAL_TOKEN: compose-local-internal-token-at-least-32chars
      BUILDER_CONTROL_URL: http://aistio-control:8081
      BUILDER_DATA_URL: http://aistio-data:8082
      SERVER_PORT: 8083
      BUILDER_SCHEDULER_URL: http://aistio-scheduler:8083
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8083/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    depends_on:
      aistio-control:
        condition: service_healthy
      aistio-data:
        condition: service_healthy
    networks:
      - yunxi-net

  aistio-gateway:
    build:
      context: ${AISTIO_SRC:-../agentscope-java-2.0GA/agentscope-service}
      dockerfile: docker/Dockerfile.plane
      args:
        JAR_FILE: service-gateway/target/service-gateway-${AISTIO_VERSION:-2.0.3}.jar
    container_name: yunxi-aistio-gateway
    restart: unless-stopped
    profiles: ["aistio"]
    environment:
      SERVER_PORT: 8080
      BUILDER_CONTROL_URL: http://aistio-control:8081
      BUILDER_DATA_URL: http://aistio-data:8082
      BUILDER_SCHEDULER_URL: http://aistio-scheduler:8083
    ports:
      - "18080:8080"   # 发布到主机 18080，避开本编排中 Nacos 控制台已占用的 8080
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    depends_on:
      aistio-control:
        condition: service_healthy
      aistio-data:
        condition: service_healthy
      aistio-scheduler:
        condition: service_healthy
    networks:
      - yunxi-net

networks:
  yunxi-net:
    driver: bridge

volumes:
  yunxi-mysql-data:
  yunxi-redis-data:
  yunxi-etcd-data:
  yunxi-minio-data:
  yunxi-milvus-data:
  yunxi-nacos-data:
  yunxi-nacos-logs:
  aistio-db-data:
