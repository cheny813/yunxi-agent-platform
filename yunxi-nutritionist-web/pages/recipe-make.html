<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>智能配餐 · 云曦营养师</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body>
  <!-- 顶部 -->
  <header class="nav">
    <div class="nav-inner">
      <a class="brand" href="../index.html">
        <span class="brand-mark">云</span>
        <span class="brand-name">云曦营养师</span>
      </a>
      <nav class="nav-links">
        <a href="../index.html">首页</a>
        <a href="recipe-make.html" class="active">智能配餐</a>
        <a href="../index.html#scenes">应用场景</a>
        <a href="../index.html#about">关于</a>
      </nav>
    </div>
  </header>

  <!-- 工作台 -->
  <main class="workbench">
    <!-- 左栏：目标表单 -->
    <section class="panel form-panel">
      <h2 class="panel-title">配餐目标</h2>
      <form id="recipe-form" class="goal-form">
        <div class="field">
          <label for="crowd">适用人群</label>
          <select id="crowd" name="crowd">
            <option value="">请选择</option>
            <option value="儿童">儿童</option>
            <option value="成人">成人</option>
            <option value="老人">老人</option>
            <option value="孕产">孕产</option>
            <option value="慢病">慢病</option>
          </select>
        </div>

        <div class="field">
          <label for="goal">健康目标</label>
          <select id="goal" name="goal">
            <option value="">请选择</option>
            <option value="减脂">减脂</option>
            <option value="增肌">增肌</option>
            <option value="控糖">控糖</option>
            <option value="均衡">均衡</option>
          </select>
        </div>

        <div class="field">
          <label for="allergy">饮食禁忌（过敏源，可多选）</label>
          <div id="allergy" class="checkbox-group">
            <label><input type="checkbox" name="allergy" value="海鲜" /> 海鲜</label>
            <label><input type="checkbox" name="allergy" value="坚果" /> 坚果</label>
            <label><input type="checkbox" name="allergy" value="蛋类" /> 蛋类</label>
            <label><input type="checkbox" name="allergy" value="乳制品" /> 乳制品</label>
            <label><input type="checkbox" name="allergy" value="麸质" /> 麸质</label>
          </div>
        </div>

        <div class="field">
          <label for="avoid">忌口 / 偏好食材</label>
          <input type="text" id="avoid" name="avoid" placeholder="如：不吃香菜、偏好鸡肉" />
        </div>

        <div class="field">
          <label for="calorie">热量预算（kcal/天）</label>
          <input type="number" id="calorie" name="calorie" placeholder="如 1500" min="800" max="4000" />
        </div>

        <button type="submit" id="generate-btn" class="btn btn-primary btn-block">生成方案</button>
      </form>
    </section>

    <!-- 右栏：AI 对话助手（自有漂亮 UI，复用底层 pageController 操作左栏表单） -->
    <section class="panel chat-panel" id="ai-chat">
      <div class="chat-head">
        <div class="chat-title">
          <span class="chat-avatar">AI</span>
          <div>
            <h2 class="panel-title" style="margin:0;">AI 营养助手</h2>
            <span class="chat-status" id="chat-status">已就绪</span>
          </div>
        </div>
        <button class="chat-collapse" id="chat-collapse" title="收起">—</button>
      </div>

      <div class="chat-body" id="chat-body">
        <div class="chat-msg ai">
          你好，我是云曦 AI 营养助手。描述一下需求，例如「帮我配一份 1500kcal 的糖尿病友好午餐」，我会直接填写左侧表单并生成方案。
        </div>
      </div>

      <div class="chat-foot">
        <button class="chat-fill" id="chat-fill" title="让 AI 根据对话自动填写左侧表单">↳ 自动填表</button>
        <input class="chat-input" id="chat-input" type="text" placeholder="描述你的配餐需求…" />
        <button class="chat-send" id="chat-send">发送</button>
      </div>
    </section>
  </main>

  <!-- 结果区 -->
  <section class="result-section">
    <div class="section-head">
      <h2>营养方案</h2>
      <p>由云曦营养师生成，含食谱卡片与营养评分</p>
    </div>
    <div id="result-area" class="result-area">
      <p class="result-empty">填写目标或向 AI 助手描述需求后，方案将显示在这里。</p>
    </div>
    <!-- 任务清单面板：由 yunxiChat 的 onTodo 回调驱动（纯前端透出框架 todo_write 事件）
         位于 #result-area 之外，避免被 onDone 重写结果区时覆盖。 -->
    <div id="todo-panel" class="todo-panel" hidden></div>
    <!-- A2UI 界面面板：由 yunxiChat 的 onA2ui 回调驱动（后端校验通过的界面载荷，
         经官方 @a2ui/web_core 引擎渲染）。与任务清单同理由：位于 #result-area 之外。 -->
    <div id="a2ui-panel" class="a2ui-panel" hidden>
      <div class="a2ui-panel-title">智能界面</div>
      <div id="a2ui-area" class="a2ui-area"></div>
    </div>
    <!-- Macro 界面面板：由 onMacroDsl 回调驱动（@macroui/a2ui 渲染报表/图表/表格）。 -->
    <div id="macro-panel" class="a2ui-panel" hidden>
      <div class="a2ui-panel-title">
        数据报表
        <button type="button" id="macro-theme-btn" class="macro-theme-btn" title="切换明暗主题">◐</button>
      </div>
      <div id="macro-area" class="macro-area"></div>
    </div>
  </section>

  <footer class="footer">
    <div class="footer-inner">
      <span>云曦营养师 · 机构级 AI 营养管家</span>
      <span class="footer-muted">营养评分由后端营养引擎提供，前端不做伪造计算</span>
    </div>
  </footer>

  <style>
    /* 智能页面统一走全局深色主题（style.css 的 --surface / --border / --text / --primary），
       与站点外壳同一套视觉语言；仅状态语义色（优/良/待改善）局部提亮以适配深色底。 */
    /* AI 对话右栏（自有 UI，复用底层 pageController 操作左栏） */
    #ai-chat { display:flex; flex-direction:column; min-height:520px; max-height:78vh; }
    .chat-head { display:flex; align-items:center; justify-content:space-between; padding:4px 2px 12px; border-bottom:1px solid var(--border); }
    .chat-title { display:flex; align-items:center; gap:10px; }
    .chat-avatar { width:34px; height:34px; border-radius:10px; background:linear-gradient(135deg,var(--primary),var(--primary-2)); color:#fff; font-size:13px; font-weight:700; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 14px rgba(57,182,255,.25); }
    .chat-status { font-size:12px; color:var(--accent); }
    .chat-collapse { border:none; background:transparent; font-size:20px; cursor:pointer; color:var(--text-muted); line-height:1; }
    .chat-body { flex:1; overflow-y:auto; padding:14px 4px; display:flex; flex-direction:column; gap:12px; }
    .chat-msg { max-width:88%; padding:10px 13px; border-radius:14px; font-size:14px; line-height:1.6; white-space:pre-wrap; word-break:break-word; }
    .chat-msg.ai { align-self:flex-start; background:var(--surface-2); color:var(--text); border:1px solid var(--border); border-bottom-left-radius:4px; }
    .chat-msg.user { align-self:flex-end; background:linear-gradient(135deg,var(--primary),var(--primary-2)); color:#fff; border-bottom-right-radius:4px; }
    .chat-msg.thinking { opacity:.6; font-style:italic; }
    .chat-foot { display:flex; gap:8px; padding-top:12px; border-top:1px solid var(--border); align-items:center; }
    .chat-input { flex:1; border:1px solid var(--border); background:var(--surface-2); border-radius:10px; padding:10px 12px; font-size:14px; color:var(--text); outline:none; }
    .chat-input::placeholder { color:var(--text-muted); }
    .chat-input:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(57,182,255,.15); }
    .chat-send { border:none; background:linear-gradient(135deg,var(--primary),var(--primary-2)); color:#fff; border-radius:10px; padding:10px 16px; font-size:14px; cursor:pointer; }
    .chat-send:disabled { opacity:.5; cursor:default; }
    .chat-fill { border:1px solid rgba(57,182,255,.45); background:rgba(57,182,255,.12); color:var(--primary); border-radius:10px; padding:10px; font-size:13px; cursor:pointer; white-space:nowrap; }
    .chat-fill:hover { background:rgba(57,182,255,.2); }
    .chat-fill:disabled { opacity:.5; cursor:default; }
    #ai-chat.collapsed .chat-body, #ai-chat.collapsed .chat-foot { display:none; }
    /* 生成方案按钮 loading 态 */
    .btn-primary:disabled { opacity:.7; cursor:not-allowed; }
    .result-area.result-loading { opacity:.6; transition:opacity .2s; }

    /* ── 营养方案卡片（路线 A：结构化 JSON 渲染）── */
    .result-area { font-size:14px; }
    .plan-card { display:flex; flex-direction:column; gap:16px; }
    .plan-head { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
    .plan-title { font-size:18px; font-weight:700; color:var(--text); }
    .score-ring { --p:0; width:96px; height:96px; border-radius:50%; flex:0 0 auto;
      background:conic-gradient(var(--primary) calc(var(--p)*1%), var(--surface-2) 0);
      display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative;
      box-shadow:0 0 20px rgba(57,182,255,.18); }
    .score-ring::before { content:""; position:absolute; inset:10px; border-radius:50%; background:var(--surface); }
    .score-ring span { position:relative; font-size:26px; font-weight:800; color:var(--primary); }
    .score-ring small { position:relative; font-size:11px; color:var(--text-muted); margin-top:2px; }
    .micro-block, .days-block { background:linear-gradient(160deg,var(--surface-2),var(--surface)); border:1px solid var(--border); border-radius:14px; padding:14px 16px; box-shadow:inset 0 1px 0 rgba(255,255,255,.03); }
    .micro-title { font-size:14px; font-weight:700; color:var(--text); margin-bottom:12px; }
    .micro-list { display:flex; flex-direction:column; gap:10px; }
    .micro-item { display:grid; grid-template-columns:64px 1fr auto; align-items:center; gap:10px; }
    .micro-name { font-size:13px; color:var(--text-muted); }
    .micro-bar { height:8px; border-radius:6px; background:var(--border); overflow:hidden; }
    .micro-bar i { display:block; height:100%; border-radius:6px; }
    .micro-bar i.good, .micro-val em.good { background:var(--accent); color:#4ade80; }
    .micro-bar i.mid, .micro-val em.mid { background:#f59e0b; color:#fbbf24; }
    .micro-bar i.low, .micro-val em.low { background:#ef4444; color:#f87171; }
    .micro-val { font-size:12px; color:var(--text-muted); white-space:nowrap; }
    .micro-val em { font-style:normal; font-weight:700; margin-left:4px; }
    .day-card { border:1px solid var(--border); border-radius:12px; padding:12px 14px; margin-bottom:12px; background:var(--surface-2); transition:border-color .2s ease; }
    .day-card:hover { border-color:rgba(57,182,255,.5); }
    .day-card:last-child { margin-bottom:0; }
    .day-head { font-weight:700; color:var(--primary); margin-bottom:8px; }
    .day-theme { font-weight:500; color:var(--text-muted); font-size:13px; margin-left:6px; }
    .meal-list { display:flex; flex-direction:column; gap:6px; }
    /* 餐别列改为内容自适应（minmax）：模型常输出「早餐（约400 kcal｜蛋白25g/...）」长串，
       固定 52px 会把整串挤成一团；自适应宽度 + nowrap 让餐别完整显示、不挤压食谱正文。 */
    .meal-row { display:grid; grid-template-columns:minmax(42px, max-content) 1fr auto; gap:10px; align-items:baseline; font-size:13px; }
    .meal-type { color:var(--accent); font-weight:600; white-space:nowrap; }
    .meal-name { color:var(--text); }
    .meal-note { font-size:11px; color:var(--text-muted); margin-left:6px; }
    .meal-kcal { color:var(--text-muted); font-size:12px; white-space:nowrap; }
    .plan-prose { color:var(--text); line-height:1.7; white-space:pre-wrap;
      background:var(--surface-2); border:1px solid var(--border); border-left:3px solid var(--primary);
      border-radius:12px; padding:16px 18px; font-size:15px; box-shadow:inset 0 1px 0 rgba(255,255,255,.03); }
    .plan-prose h3 { font-size:16px; font-weight:700; color:var(--primary); margin:12px 0 6px; }
    .plan-prose h3:first-child { margin-top:0; }
    .plan-prose ul { margin:6px 0; padding-left:20px; }
    .plan-prose li { margin:4px 0; }
    .plan-prose strong { color:var(--text); font-weight:700; }
    .plan-prose .prose-tag { display:inline-block; font-size:12px; color:var(--primary); background:rgba(57,182,255,.12);
      border:1px solid rgba(57,182,255,.35); border-radius:999px; padding:2px 10px; margin-bottom:10px; font-weight:600; }
    /* 流式阶段骨架占位：预示结构化卡片即将生成，给出连贯的「卡片在长出来」观感 */
    .plan-skeleton { display:flex; align-items:center; gap:10px; padding:18px 20px; margin-top:14px;
      background:var(--surface-2); border:1px dashed var(--border); border-radius:12px; color:var(--text-muted); font-size:13px; }
    .plan-skeleton .skeleton-dot { width:9px; height:9px; border-radius:50%; background:var(--primary);
      animation:pulseDot 1s ease-in-out infinite; }
    @keyframes pulseDot { 0%,100% { opacity:.3; transform:scale(.8); } 50% { opacity:1; transform:scale(1.1); } }

    /* ── A2UI 界面面板（yunxiChat.onA2ui 透出，官方 web_core 引擎渲染）── */
    .a2ui-panel { margin-top:16px; padding:14px; border:1px solid var(--border); border-radius:14px;
      background:linear-gradient(160deg,var(--surface-2),var(--surface)); }
    .a2ui-panel-title { font-size:13px; font-weight:700; color:var(--text); margin-bottom:10px; }
    .a2ui-area { display:flex; flex-direction:column; gap:10px; font-size:14px; color:var(--text); }
    .a2ui-text { line-height:1.6; white-space:pre-wrap; }
    .a2ui-title { font-size:15px; margin:2px 0; color:var(--text); }
    .a2ui-row { display:flex; flex-direction:row; gap:10px; align-items:center; flex-wrap:wrap; }
    .a2ui-column { display:flex; flex-direction:column; gap:10px; }
    .a2ui-card { border:1px solid var(--border); border-radius:12px; padding:12px; display:flex; flex-direction:column; gap:8px; background:var(--surface-2); }
    .a2ui-icon { color:var(--primary); font-size:16px; }
    .a2ui-image { max-width:100%; border-radius:10px; }
    .a2ui-divider { border:none; border-top:1px solid var(--border); margin:2px 0; }
    .a2ui-button { padding:8px 16px; border:none; border-radius:10px; background:linear-gradient(135deg,var(--primary),var(--primary-2)); color:#fff; font-size:14px; }
    .a2ui-button:disabled { opacity:.55; cursor:not-allowed; }
    .a2ui-placeholder { padding:8px 12px; border:1px dashed var(--border); border-radius:10px; color:var(--text-muted); font-size:13px; }
    .a2ui-issues { padding:10px; border-radius:10px; background:rgba(239,68,68,.12); color:#fca5a5; font-size:13px; }
    .a2ui-empty { color:var(--text-muted); font-size:13px; }

    /* ── Macro 报表面板（@macroui/a2ui 渲染，自带主题 + 响应式）── */
    .macro-area { font-size:14px; color:var(--text); overflow-x:auto; }
    .macro-theme-btn { float:right; border:1px solid var(--border); border-radius:8px;
      background:var(--surface-2); color:var(--text); font-size:14px; cursor:pointer; padding:2px 8px; }
    .macro-theme-btn:hover { background:var(--border); }
    /* 手机端：表格/图表允许横向滚动，SVG 图表不溢出视口 */
    @media (max-width: 640px) {
      .macro-area { font-size:13px; }
      .macro-area svg { max-width:100%; height:auto; }
      .a2ui-panel { padding:10px; }
    }

    /* ── 任务清单面板（yunxiChat.onTodo 透出）── */
    .todo-panel { margin-top:16px; padding:14px 16px; background:linear-gradient(160deg,var(--surface-2),var(--surface)); border:1px solid var(--border); border-radius:14px; }
    .todo-panel[hidden] { display:none; }
    .todo-head { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:10px; }
    .todo-title { font-size:14px; font-weight:700; color:var(--text); }
    .todo-progress { font-size:12px; color:var(--text-muted); }
    .todo-list { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
    .todo-item { display:flex; align-items:center; gap:10px; font-size:13px; line-height:1.5; }
    .todo-check { width:18px; height:18px; border-radius:50%; display:inline-flex; align-items:center;
      justify-content:center; font-size:11px; flex:0 0 auto; color:#fff; }
    .todo-completed .todo-check { background:var(--accent); }
    .todo-completed .todo-content { color:var(--text-muted); text-decoration:line-through; }
    .todo-in_progress .todo-check { background:#f59e0b; }
    .todo-pending .todo-check { background:var(--border); color:var(--text-muted); }
    .todo-content { flex:1; color:var(--text); word-break:break-word; }
    .todo-pri { font-size:11px; padding:1px 8px; border-radius:8px; flex:0 0 auto; text-transform:capitalize; }
    .pri-high { background:rgba(239,68,68,.15); color:#fca5a5; }
    .pri-medium { background:rgba(245,158,11,.15); color:#fbbf24; }
    .pri-low { background:rgba(56,189,248,.15); color:#7dd3fc; }
  </style>

  <!-- 公共 SDK 入口（agent-web-sdk 单一源）：
       PageAgentDomEngine / FormFillClient / FormFillDebug / PageAgentSDK(loader) -->
  <script type="module" src="/src/entry.js"></script>
  <script type="module">
    const $ = (id) => document.getElementById(id);
    let FF = null;  // mcp-formfill 客户端单例（页面级引用，供各处复用）

    // ── 1. 表单实时通道接入 ──
    // 写页面能力统一收敛到 FormFillClient → PageAgentDomEngine，不再依赖 LLM Agent 循环。
    // mcp-formfill 服务当前不在本地依赖栈内（见 vite.config.js：/ws/formfill 代理已移除），
    // 默认不连接以免控制台噪声；需要联调时以 ?formfill=1 或 window.FORMFILL_ENABLED=true 打开。
    (async function initClient() {
      const formfillEnabled =
        window.FORMFILL_ENABLED === true ||
        new URLSearchParams(location.search).get('formfill') === '1';
      if (!formfillEnabled) return;
      FF = window.FormFillClient.getClient()
        .onLog((m) => {
          if (m.indexOf('⚠') === 0) addMsg('ai', m);
        });
      try {
        await FF.connect({ wsPath: '/ws/formfill' });
        // 闭环自举：上报真实页面结构，后端 AgentScope 自动注册表单字段
        FF.reportStructure('recipe', { bootstrap: true }).catch(() => {});
      } catch (e) {
        addMsg('ai', '表单实时通道连接失败：' + e.message);
      }
    })();

    function addMsg(role, text, extraClass) {
      const div = document.createElement('div');
      div.className = 'chat-msg ' + role + (extraClass ? ' ' + extraClass : '');
      div.textContent = text;
      $('chat-body').appendChild(div);
      $('chat-body').scrollTop = $('chat-body').scrollHeight;
      return div;
    }

    // ── 2. 右栏对话 UI 交互 ──
    const chatBody = $('chat-body');
    const chatInput = $('chat-input');
    const chatSend = $('chat-send');

    async function sendMessage() {
      const text = chatInput.value.trim();
      if (!text) return;
      chatInput.value = '';
      addMsg('user', text);

      const thinking = addMsg('ai', '思考中…', 'thinking');
      chatSend.disabled = true;

      try {
        const res = await fetch(window.location.origin + '/v1/chat/completions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Agent-Token': 'page-agent' },
          credentials: 'include',
          body: JSON.stringify({
            model: 'qwen-plus',
            messages: [
              { role: 'system', content: '你是云曦营养配餐助手。如能从用户需求中提取配餐表单字段，请在回复末尾用 <!--form:{...}--> 包裹 JSON 字段，便于前端自动填表；其余情况正常自然语言回复。\n\n字段取值必须严格从下列选项中选择，不得自造：\n- crowd（适用人群）只能取：儿童 / 成人 / 老人 / 孕产 / 慢病（如"45岁男性"映射到"成人"，"糖尿病人"映射到"慢病"）\n- goal（健康目标）只能取：减脂 / 增肌 / 控糖 / 均衡（如"均衡营养、控制负担"映射到"均衡"）\n- allergy（饮食禁忌/过敏源）只能是数组，元素只能取：海鲜 / 坚果 / 蛋类 / 乳制品 / 麸质\n- avoid（忌口偏好）自由文本\n- calorie（每日热量预算 kcal）必须是单个整数，范围 800–4000；若用户给区间（如"500-600"），取区间上界或中位数作为单个整数' },
              { role: 'user', content: text }
            ]
          })
        });
        const data = await res.json();
        const reply = (data.choices && data.choices[0] && data.choices[0].message.content)
          || JSON.stringify(data);
        thinking.remove();
        addMsg('ai', reply);

        // 若后端返回了 form 标记，经 mcp-formfill 统一写路径填左栏
        const m = reply.match(/<!--form:([\s\S]*?)-->/);
        if (m && FF) {
          try { await FF.fillForm(JSON.parse(m[1]), null, { scene: 'recipe' }); } catch (_) {}
        }
      } catch (err) {
        thinking.remove();
        addMsg('ai', '请求失败：' + err.message);
      } finally {
        chatSend.disabled = false;
      }
    }

    chatSend.addEventListener('click', sendMessage);
    chatInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });
    $('chat-collapse').addEventListener('click', () => $('ai-chat').classList.toggle('collapsed'));

    // Macro 报表主题切换（明/暗）：默认 dark 与站点深色底一致，点击切到浅色细读
    let macroDark = true;
    $('macro-theme-btn').title = '切换明暗主题（当前：深色）';
    $('macro-theme-btn').addEventListener('click', () => {
      macroDark = !macroDark;
      $('macro-theme-btn').title = '切换明暗主题（当前：' + (macroDark ? '深色' : '浅色') + '）';
      window.MacroRenderer.setTheme(macroDark ? 'dark' : 'default');
    });

    // ── 3. 自动填表：DomEngine 读取真实页面字段 → LLM 看图说话 → FormFillClient 写回 ──
    const chatFillBtn = $('chat-fill');
    chatFillBtn.addEventListener('click', async () => {
      // 立即禁用并提示，给出明确交互反馈
      chatFillBtn.disabled = true;
      const fillOriginal = chatFillBtn.textContent;
      chatFillBtn.textContent = '填表中…';

      // 优先用 DomEngine.scan() 读真实页面字段（零 SDK 依赖）
      const engine = window.PageAgentDomEngine;
      let pageDesc = '';
      if (engine && typeof engine.scan === 'function') {
        try {
          const fields = engine.scan(true);
          pageDesc = JSON.stringify(fields, null, 2).slice(0, 3000);
        } catch (_) { pageDesc = '(页面状态读取失败)'; }
      }
      const lastUser = [...chatBody.querySelectorAll('.chat-msg.user')].pop();
      const demand = lastUser ? lastUser.textContent : '';
      if (!demand) { addMsg('ai', '请先在对话框描述你的需求，再点「自动填表」。'); return; }

      addMsg('ai', '正在根据对话填写左侧表单…', 'thinking').remove();
      try {
        const res = await fetch(window.location.origin + '/v1/chat/completions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Agent-Token': 'page-agent' },
          credentials: 'include',
          body: JSON.stringify({
            model: 'qwen-plus',
            messages: [
              { role: 'system', content: '根据用户需求与页面表单字段，输出 JSON：{crowd,goal,allergy[],avoid,calorie}。只输出 JSON，不要解释。' },
              { role: 'user', content: '需求：' + demand + '\n页面字段：' + pageDesc }
            ]
          })
        });
        const data = await res.json();
        const content = (data.choices && data.choices[0] && data.choices[0].message.content) || '';
        const json = content.match(/\{[\s\S]*\}/);
        if (json && FF) await FF.fillForm(JSON.parse(json[0]), { scene: 'recipe' });
      } catch (err) {
        addMsg('ai', '自动填表失败：' + err.message);
      } finally {
        chatFillBtn.disabled = false;
        chatFillBtn.textContent = fillOriginal;
      }
    });

    // ── 4. 表单提交（手动通道，保留）──
    const generateBtn = $('generate-btn');
    $('recipe-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const payload = {
        crowd: fd.get('crowd'), goal: fd.get('goal'),
        allergy: fd.getAll('allergy'), avoid: fd.get('avoid'), calorie: fd.get('calorie')
      };

      // 立即给出交互反馈：禁用按钮 + 文案变「生成中…」+ 结果区进入加载态
      generateBtn.disabled = true;
      const originalText = generateBtn.textContent;
      generateBtn.textContent = '生成中…';
      const area = $('result-area');
      area.innerHTML = '<p class="result-empty">正在生成方案…</p>';
      area.classList.add('result-loading');

      // 重新生成：先清掉上一轮的结构化面板（智能界面 / 数据报表），
      // 避免旧方案残留与新方案混排（面板由本轮事件回调重新唤起）。
      const a2uiPanel = $('a2ui-panel');
      if (a2uiPanel) { a2uiPanel.hidden = true; $('a2ui-area').innerHTML = ''; }
      const macroPanel = $('macro-panel');
      if (macroPanel) { macroPanel.hidden = true; $('macro-area').innerHTML = ''; }

      try {
        // 路线 A：走 resident-nutrition-assistant Agent（居民口径，含真实营养评分链路 evaluate_recipe）
        // 注意：不要直接打 /v1/chat/completions（裸 LLM 透传，无评分能力）
        // 用通用 yunxiChat：mode 决定同步/流式，页面逻辑无需因模式而变。
        // mode:'stream' 时 onDelta 实时拼字形成打字机；mode:'sync' 时不传 onDelta 即可。
        await yunxiChat({
          agentId: 'resident-nutrition-assistant',
          context: { profile: 'recipe-make' },
          mode: 'stream',
          autoManageConversation: true,
          text: '根据以下目标生成营养配餐方案（含食谱卡片与微量营养素评分）：' + JSON.stringify(payload),
          onDelta: (delta, full) => {
            // 流式实时渲染：说明卡片（prose）逐字长出 + 下方骨架占位预示「食谱卡片即将生成」，
            // 让整个输出读起来是「同一张卡片在长出来」，而非两波独立输出。
            let live = $('prose-live');
            if (!live) {
              area.innerHTML =
                '<div class="plan-prose"><span class="prose-tag">营养方案（生成中…）</span><span id="prose-live"></span></div>'
                + '<div class="plan-skeleton"><span class="skeleton-dot"></span>正在生成食谱卡片…</div>';
              live = $('prose-live');
            }
            // 流式阶段隐藏末尾用于渲染卡片的 JSON 块，避免面向大众逐字滚出技术化 JSON
            live.textContent = livePreview(full);
          },
          onDone: (full) => {
            // 流结束：流式阶段的「说明卡片」原位保留（位置不变、不跳动）；
            // 下方骨架替换为真实结构化卡片（评分圆环 + 微量元素 + 食谱安排）。
            // 二者共存 = 完整方案，读出「同一张卡片长完整」的连贯感，而非第二波输出。
            const prose = renderProse(stripJson(full));
            const plan = parsePlan(full);
            const proseCard = '<div class="plan-prose"><span class="prose-tag">营养方案说明</span>' + prose + '</div>';
            if (!plan) {
              // 解析失败兜底：保留说明卡片（已剥离 JSON），不补结构化卡片
              area.innerHTML = proseCard;
              return;
            }
            area.innerHTML = proseCard + buildPlanStructured(plan);
          },
          onA2ui: (payload) => {
            // A2UI 界面载荷（后端已校验）：经官方 @a2ui/web_core 引擎渲染到独立面板
            const panel = $('a2ui-panel');
            if (!panel) return;
            panel.hidden = false;
            window.A2uiRenderer.mountA2ui($('a2ui-area'), payload);
          },
          onMacroDsl: (dsl) => {
            // @macroui/a2ui DSL 报表/图表：由公共渲染组件渲染到独立面板
            const panel = $('macro-panel');
            if (!panel) return;
            panel.hidden = false;
            // 渲染器实例构造时固定 theme:'default'，每次渲染前按当前选择同步，默认 dark 与站点深色底一致
            window.MacroRenderer.setTheme(macroDark ? 'dark' : 'default');
            window.MacroRenderer.render($('macro-area'), dsl);
          },
          // 任务清单透出：Agent 调用 todo_write 工具时，框架透出 TOOL_RESULT 事件，
          // SDK 还原结构化任务列表后回调此处（纯前端识别，后端零改动）。
          onTodo: (todos) => renderTodoPanel(todos)
        });
      } catch (err) {
        area.innerHTML = '<p class="result-empty">生成失败：' + err.message + '</p>';
      } finally {
        generateBtn.disabled = false;
        generateBtn.textContent = originalText;
        area.classList.remove('result-loading');
      }
    });

    // ── 解析结构化 JSON（从 ```json 块或最后一个 JSON 对象）──
    function parsePlan(content) {
      if (!content) return null;
      const jsonMatch = content.match(/```json\s*([\s\S]*?)```/) || content.match(/\{[\s\S]*\}/);
      const jsonStr = jsonMatch ? (jsonMatch[1] || jsonMatch[0]) : null;
      if (!jsonStr) return null;
      try { return JSON.parse(jsonStr.trim()); } catch (e) { return null; }
    }

    // ── 仅渲染结构化卡片（评分圆环 + 微量元素 + 食谱安排），不含文案；文案由 onDone 单独承载 ──
    function buildPlanStructured(plan) {
      const score = plan.nutritionScore ?? plan.score ?? null;
      const microRaw = plan.microRatings || plan.micro || (plan.dimensions && plan.dimensions.micro) || [];
      const days = Array.isArray(plan.days) ? plan.days : [];

      // 微量元素 / 维生素评分：后端实际返回数组 [{name, score, max?, status?}]，
      // 兼容旧「对象 map」形态 {"能量": {score}}。先统一规整为 entry 列表，再渲染元素名。
      let microEntries = [];
      if (Array.isArray(microRaw)) {
        microEntries = microRaw
          .map(it => ({
            name: it.name || it.label || it.key || '',
            score: Number(it.score ?? it.value ?? 0),
            max: Number(it.max ?? it.fullMark ?? 100),
            status: it.status || ''
          }))
          .filter(e => e.name);
      } else if (microRaw && typeof microRaw === 'object') {
        microEntries = Object.keys(microRaw).map(k => {
          const m = microRaw[k] || {};
          return {
            name: k,
            score: Number(m.score ?? m.value ?? 0),
            max: Number(m.max ?? m.fullMark ?? 100),
            status: m.status || ''
          };
        });
      }

      let html = '<div class="plan-card">';
      html += '<div class="plan-head">';
      html += '<div class="plan-title">' + escapeHtml(plan.recipeName || plan.title || '营养配餐方案') + '</div>';
      if (score != null) {
        const pct = Math.max(0, Math.min(100, Number(score)));
        html += '<div class="score-ring" style="--p:' + pct + '"><span>' + score + '</span><small>综合营养分</small></div>';
      }
      html += '</div>';

      // 微量元素 / 维生素评分条
      if (microEntries.length) {
        html += '<div class="micro-block"><div class="micro-title">微量元素 / 维生素评分</div><div class="micro-list">';
        for (const e of microEntries) {
          const s = e.score;
          const max = e.max;
          const pct = max ? Math.round(s / max * 100) : 0;
          const status = e.status || (pct >= 80 ? '优' : pct >= 60 ? '良' : '待改善');
          const cls = pct >= 80 ? 'good' : pct >= 60 ? 'mid' : 'low';
          html += '<div class="micro-item">'
            + '<span class="micro-name">' + escapeHtml(e.name) + '</span>'
            + '<div class="micro-bar"><i class="' + cls + '" style="width:' + pct + '%"></i></div>'
            + '<span class="micro-val">' + s + (max && max !== 100 ? '/' + max : '') + ' <em class="' + cls + '">' + status + '</em></span>'
            + '</div>';
        }
        html += '</div></div>';
      }

      // 食谱卡片（按天/餐）
      if (days.length) {
        html += '<div class="days-block"><div class="micro-title">食谱安排</div>';
        for (const d of days) {
          const dayLabel = d.day != null ? ('第' + d.day + '天') : (d.label || '方案');
          const theme = d.title || d.theme || '';
          html += '<div class="day-card"><div class="day-head">'
            + escapeHtml(dayLabel)
            + (theme ? ' <span class="day-theme">' + escapeHtml(theme) + '</span>' : '')
            + '</div><div class="meal-list">';
          // 支持两种形态：items 为字符串数组（如 "早餐：燕麦+蓝莓"），meals 为对象数组。
          const mealItems = Array.isArray(d.meals) ? d.meals : (Array.isArray(d.items) ? d.items : []);
          for (const meal of mealItems) {
            let type = '', name = '', note = '', kcal = '';
            if (typeof meal === 'string') {
              // 模型常见形态：
              //  a) "早餐：燕麦+蓝莓"
              //  b) "早餐（约400 kcal｜蛋白25g/碳水40g/脂肪15g）：燕麦+蓝莓" —— 括号内营养信息是备注，
              //     不能整串塞进餐别列（固定宽时挤成一团），拆出为 note 小字。
              const bracket = meal.match(/^\s*([^（(]+?)\s*[（(]([^）)]*)[）)]\s*[:：\-–—]?\s*(.*)$/);
              const simple = meal.match(/^\s*([^:：\-–—（(]+?)\s*[:：\-–—]\s*(.*)$/);
              if (bracket) {
                type = bracket[1].trim(); note = bracket[2].trim(); name = bracket[3].trim();
              } else if (simple) {
                type = simple[1].trim(); name = simple[2].trim();
              } else {
                name = meal.trim();
              }
            } else {
              name = meal.name || meal.dish || '';
              type = meal.type || meal.meal || '';
              note = meal.note || meal.description || '';
            }
            kcal = (meal && typeof meal === 'object') ? (meal.calorie ?? meal.kcal ?? '') : '';
            html += '<div class="meal-row">'
              + '<span class="meal-type">' + escapeHtml(type) + '</span>'
              + '<span class="meal-name">' + escapeHtml(name)
              + (note ? '<span class="meal-note">（' + escapeHtml(note) + '）</span>' : '')
              + '</span>'
              + (kcal !== '' ? '<span class="meal-kcal">' + escapeHtml(String(kcal)) + ' kcal</span>' : '')
              + '</div>';
          }
          html += '</div></div>';
        }
        html += '</div>';
      }
      html += '</div>';
      return html;
    }

    function stripJson(text) {
      return text.replace(/```json[\s\S]*?```/g, '').replace(/\{[\s\S]*\}/, '').replace(/\n{3,}/g, '\n\n').trim();
    }

    // 流式阶段预览：只展示方案说明文案，把用于渲染卡片的 ```json 块隐藏，
    // 避免面向大众逐字滚出技术化 JSON；终稿由 onDone 用卡片（已剥离 JSON）定稿。
    // 同时折叠模型推理常产生的连续空行（最多保留一个空行），去除行尾空白，避免大段留白。
    function livePreview(text) {
      const idx = text.indexOf('```json');
      let s = idx >= 0 ? text.slice(0, idx) : text;
      s = s
        .replace(/[ \t]+\n/g, '\n')   // 去行尾空白
        .replace(/\n{3,}/g, '\n\n')   // 3+ 换行折叠为一个空行
        .replace(/^\n+/, '')          // 去开头空行
        .replace(/\n+$/, '');         // 去结尾空行
      return s;
    }

    // 纯文本/Markdown 方案的基础渲染：先转义防 XSS，再识别标题/列表/加粗，保证可读性
    function renderProse(text) {
      const lines = escapeHtml(text).split('\n');
      let html = '';
      let inList = false;
      const closeList = () => { if (inList) { html += '</ul>'; inList = false; } };
      for (let raw of lines) {
        const line = raw.replace(/\s+$/, '');
        if (/^###?\s+/.test(line)) {
          closeList();
          html += '<h3>' + line.replace(/^###?\s+/, '') + '</h3>';
        } else if (/^[-*]\s+/.test(line)) {
          if (!inList) { html += '<ul>'; inList = true; }
          html += '<li>' + line.replace(/^[-*]\s+/, '').replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>') + '</li>';
        } else {
          closeList();
          const p = line.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
          if (p.trim()) html += '<p>' + p + '</p>';
        }
      }
      closeList();
      return html;
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    // ── 任务清单面板渲染 ──
    // todos: yunxiChat.onTodo 透出的结构化数组 [{content,status,priority}]
    // status: 'completed' | 'in_progress' | 'pending'；priority: 'high'|'medium'|'low'|null
    // 全部内容经 escapeHtml 转义，杜绝任务文本（模型生成）注入 HTML。
    function renderTodoPanel(todos) {
      const panel = $('todo-panel');
      if (!panel) return;
      if (!Array.isArray(todos) || todos.length === 0) {
        panel.hidden = true;
        panel.innerHTML = '';
        return;
      }
      const done = todos.filter(t => t.status === 'completed').length;
      const inProg = todos.filter(t => t.status === 'in_progress').length;
      const icon = { completed: '✓', in_progress: '▶', pending: '○' };
      let html = '<div class="todo-head"><span class="todo-title">任务清单</span>'
        + '<span class="todo-progress">' + done + '/' + todos.length + ' 已完成'
        + (inProg ? ' · ' + inProg + ' 进行中' : '') + '</span></div>';
      html += '<ul class="todo-list">';
      for (const t of todos) {
        const st = t.status || 'pending';
        const pri = t.priority
          ? '<span class="todo-pri pri-' + escapeHtml(t.priority) + '">' + escapeHtml(t.priority) + '</span>'
          : '';
        html += '<li class="todo-item todo-' + st + '">'
          + '<span class="todo-check">' + (icon[st] || '○') + '</span>'
          + '<span class="todo-content">' + escapeHtml(t.content || '') + '</span>'
          + pri + '</li>';
      }
      html += '</ul>';
      panel.innerHTML = html;
      panel.hidden = false;
    }
  </script>
</body>
</html>
